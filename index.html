                                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                                        <div className="lg:col-span-4 bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-100 h-fit">
                                            <h3 className="text-xl font-bold mb-6 flex items-center text-slate-800"><Plus className="mr-2 text-blue-600"/> Thêm mẫu mới</h3>
                                            <form onSubmit={handleAddTemplate} className="space-y-5">
                                                <div>
                                                    <label className="block text-sm font-semibold text-slate-700 mb-2">Hình ảnh</label>
                                                    <div className="flex items-center space-x-4">
                                                        {templateForm.image && (
                                                            <div className="relative group">
                                                                <img src={templateForm.image} alt="Preview" className="w-20 h-20 object-cover rounded-2xl shadow-sm border" />
                                                                <button type="button" onClick={() => setTemplateForm({...templateForm, image: ''})} className="absolute -top-2 -right-2 bg-rose-500 text-white rounded-full p-1.5 shadow-md opacity-0 group-hover:opacity-100 transition-opacity"><X size={14}/></button>
                                                            </div>
                                                        )}
                                                        <label className="flex flex-col items-center justify-center flex-1 h-20 border-2 border-dashed border-slate-300 rounded-2xl hover:bg-blue-50 hover:border-blue-300 cursor-pointer transition-colors group">
                                                            <Upload size={20} className="text-slate-400 group-hover:text-blue-500 mb-1" />
                                                            <span className="text-xs font-semibold text-slate-500 group-hover:text-blue-600">Chọn ảnh</span>
                                                            <input type="file" accept="image/*" className="hidden" onChange={handleImageChange} />
                                                        </label>
                                                    </div>
                                                </div>

                                                <div>
                                                    <label className="block text-sm font-semibold text-slate-700 mb-1.5">Danh mục</label>
                                                    <select value={templateForm.category} onChange={(e) => setTemplateForm({...templateForm, category: e.target.value, model: '', name: ''})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all font-medium">
                                                        <option>Bàn phím</option><option>Chuột</option><option>Keycap</option><option>Tai nghe</option><option>Switch</option>
                                                    </select>
                                                </div>
                                                
                                                <div><label className="block text-sm font-semibold text-slate-700 mb-1.5">Hãng (Thương hiệu)</label><input required placeholder="VD: Aula, Akko..." value={templateForm.brand} onChange={e => setTemplateForm({...templateForm, brand: e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 transition-all" /></div>
                                                
                                                {templateForm.category === 'Bàn phím' && (
                                                    <>
                                                    <div><label className="block text-sm font-semibold text-slate-700 mb-1.5">Mã SP</label><input required placeholder="VD: F75" value={templateForm.model} onChange={e => setTemplateForm({...templateForm, model: e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 transition-all" /></div>
                                                    <div><label className="block text-sm font-semibold text-slate-700 mb-1.5">Switch</label><input placeholder="VD: Greywood V3" value={templateForm.switchType} onChange={e => setTemplateForm({...templateForm, switchType: e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 transition-all" /></div>
                                                    <div><label className="block text-sm font-semibold text-slate-700 mb-1.5">Màu sắc</label><input placeholder="VD: Trắng Xanh" value={templateForm.color} onChange={e => setTemplateForm({...templateForm, color: e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 transition-all" /></div>
                                                    </>
                                                )}

                                                {templateForm.category === 'Chuột' && (
                                                    <>
                                                    <div><label className="block text-sm font-semibold text-slate-700 mb-1.5">Mã SP</label><input required value={templateForm.model} onChange={e => setTemplateForm({...templateForm, model: e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 transition-all" /></div>
                                                    <div><label className="block text-sm font-semibold text-slate-700 mb-1.5">Kết nối</label>
                                                        <select value={templateForm.connectionType} onChange={e => setTemplateForm({...templateForm, connectionType: e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 transition-all">
                                                            <option>3 mode</option><option>Có dây</option><option>Bluetooth</option><option>2.4G (Dongle)</option>
                                                        </select>
                                                    </div>
                                                    <div><label className="block text-sm font-semibold text-slate-700 mb-1.5">Màu sắc</label><input value={templateForm.color} onChange={e => setTemplateForm({...templateForm, color: e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 transition-all" /></div>
                                                    </>
                                                )}

                                                {templateForm.category === 'Keycap' && (
                                                    <>
                                                    <div><label className="block text-sm font-semibold text-slate-700 mb-1.5">Profile</label>
                                                        <select value={templateForm.profile} onChange={e => setTemplateForm({...templateForm, profile: e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 transition-all">
                                                            <option>OEM</option><option>Cherry</option><option>SA</option><option>XDA</option><option>MOA</option>
                                                        </select>
                                                    </div>
                                                    <div><label className="block text-sm font-semibold text-slate-700 mb-1.5">Chủ đề/Tên</label><input required value={templateForm.name} onChange={e => setTemplateForm({...templateForm, name: e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 transition-all" /></div>
                                                    </>
                                                )}

                                                {!['Bàn phím', 'Chuột', 'Keycap'].includes(templateForm.category) && (
                                                    <>
                                                    <div><label className="block text-sm font-semibold text-slate-700 mb-1.5">Tên / Mã SP</label><input required value={templateForm.model} onChange={e => setTemplateForm({...templateForm, model: e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 transition-all" /></div>
                                                    <div><label className="block text-sm font-semibold text-slate-700 mb-1.5">Phân loại</label><input value={templateForm.color} onChange={e => setTemplateForm({...templateForm, color: e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 transition-all" /></div>
                                                    </>
                                                )}

                                                <div className="grid grid-cols-2 gap-4 pt-2">
                                                    <div><label className="block text-sm font-semibold text-slate-700 mb-1.5">Giá nhập chuẩn</label><input required type="number" value={templateForm.importPrice} onChange={e => setTemplateForm({...templateForm, importPrice: e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 transition-all" /></div>
                                                    <div><label className="block text-sm font-semibold text-slate-700 mb-1.5 text-blue-600">Giá bán đề xuất</label><input required type="number" value={templateForm.exportPrice} onChange={e => setTemplateForm({...templateForm, exportPrice: e.target.value})} className="w-full p-3 bg-blue-50 border border-blue-200 rounded-xl outline-none focus:border-blue-500 font-bold text-blue-700 transition-all" /></div>
                                                </div>

                                                <button type="submit" className="w-full bg-slate-900 text-white py-4 rounded-xl font-bold flex justify-center items-center hover:bg-slate-800 transition-all shadow-lg hover:shadow-xl hover:-translate-y-0.5 mt-4">
                                                    Thêm vào Thư viện
                                                </button>
                                            </form>
                                        </div>
                                        
                                        <div className="lg:col-span-8 bg-white rounded-3xl shadow-sm border border-slate-100 flex flex-col overflow-hidden h-fit">
                                            <div className="p-6 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-slate-50/50">
                                                <h3 className="font-bold text-lg">Danh sách Mẫu <span className="text-slate-400 font-normal text-sm ml-2">({filteredTemplates.length} sp)</span></h3>
                                                <div className="relative w-full sm:w-72">
                                                    <Search className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" size={18} />
                                                    <input type="text" placeholder="Tìm tên, hãng, mã sp..." value={searchTerms.templates} onChange={(e) => setSearchTerms({...searchTerms, templates: e.target.value})} className="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500 text-sm transition-all shadow-sm" />
                                                </div>
                                            </div>
                                            <div className="overflow-x-auto flex-1">
                                                <table className="w-full text-left border-collapse min-w-[500px]">
                                                    <thead><tr className="bg-white text-slate-400 text-xs uppercase tracking-wider border-b border-slate-100">
                                                        <th className="p-4 font-bold">Sản phẩm</th>
                                                        <th className="p-4 font-bold">Cấu hình & Giá (VNĐ)</th>
                                                        <th className="p-4 font-bold text-center">Tác vụ</th>
                                                    </tr></thead>
                                                    <tbody className="divide-y divide-slate-100">
                                                        {filteredTemplates.length === 0 ? <tr><td colSpan="3" className="p-12 text-center text-slate-400"><Database className="w-12 h-12 mx-auto mb-3 opacity-20"/>Không tìm thấy mẫu nào.</td></tr> : filteredTemplates.map(t => (
                                                            <tr key={t.id} className="hover:bg-slate-50 transition-colors group">
                                                                <td className="p-4 flex items-center space-x-4">
                                                                    {t.image ? <img src={t.image} alt="thumb" className="w-14 h-14 object-cover rounded-xl shadow-sm border border-slate-100 shrink-0" /> : <div className="w-14 h-14 bg-slate-100 rounded-xl flex items-center justify-center text-slate-300 shrink-0 border border-slate-200"><ImageIcon size={24}/></div>}
                                                                    <div>
                                                                        <span className="text-[10px] font-bold uppercase tracking-wider bg-slate-100 px-2 py-1 rounded text-slate-500 mb-1.5 inline-block">{t.category}</span>
                                                                        <p className="font-bold text-slate-800 text-base">{getTemplateDisplayName(t)}</p>
                                                                    </div>
                                                                </td>
                                                                <td className="p-4 text-sm text-slate-600">
                                                                    <div className="font-medium text-slate-700 mb-1">{getTemplateDetails(t)}</div>
                                                                    <div className="text-xs bg-slate-100 inline-block px-2 py-1 rounded-lg">
                                                                        Nhập: <span className="font-semibold text-slate-700">{formatCurrency(t.importPrice)}</span> <span className="mx-1 text-slate-300">|</span> Bán: <span className="text-blue-600 font-bold">{formatCurrency(t.exportPrice)}</span>
                                                                    </div>
                                                                </td>
                                                                <td className="p-4 text-center">
                                                                    <button onClick={() => handleDeleteTemplate(t.id)} className="p-2.5 text-slate-400 hover:text-rose-500 hover:bg-rose-50 rounded-xl transition-all opacity-0 group-hover:opacity-100 focus:opacity-100"><Trash2 size={18}/></button>
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                )}

                                {/* ---------------- TAB 3: KHO HÀNG ---------------- */}
                                {activeTab === 'inventory' && (
                                <div className="space-y-6 animate-fade-in relative">
                                    <div><h2 className="text-3xl font-bold text-slate-900 tracking-tight">Quản lý Kho hàng</h2><p className="text-slate-500 mt-1">Nhập hàng và kiểm soát tồn kho</p></div>
                                    
                                    <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-100">
                                        <div className="flex items-center mb-6"><PackagePlus className="text-emerald-500 mr-2"/><h3 className="font-bold text-lg">Lô hàng mới</h3></div>
                                        <form onSubmit={handleAddInventory} className="grid grid-cols-1 md:grid-cols-12 gap-5 relative">
                                            <div className="md:col-span-4 relative">
                                                <label className="block text-sm font-semibold text-slate-700 mb-1.5">Chọn Mẫu Sản Phẩm *</label>
                                                {/* THANH TÌM KIẾM MẪU SP */}
                                                <div className="relative">
                                                    <input 
                                                        type="text" 
                                                        placeholder={inventoryForm.templateId ? getTemplateDisplayName(getTemplate(inventoryForm.templateId)) : "-- Gõ tên để tìm & chọn mẫu --"}
                                                        value={templateSearchText}
                                                        onChange={e => {
                                                            setTemplateSearchText(e.target.value);
                                                            setIsTemplateDropdownOpen(true);
                                                        }}
                                                        onFocus={() => setIsTemplateDropdownOpen(true)}
                                                        onBlur={() => setTimeout(() => setIsTemplateDropdownOpen(false), 200)}
                                                        className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 transition-all font-medium text-slate-700"
                                                    />
                                                    {isTemplateDropdownOpen && (
                                                        <div className="absolute z-50 w-full mt-1 bg-white border border-slate-200 rounded-xl shadow-xl max-h-60 overflow-y-auto">
                                                            {dropdownFilteredTemplates.length > 0 ? dropdownFilteredTemplates.map(t => (
                                                                <div 
                                                                    key={t.id} 
                                                                    onClick={() => {
                                                                        setInventoryForm({...inventoryForm, templateId: t.id, costPrice: t.importPrice, sellingPrice: t.exportPrice});
                                                                        setTemplateSearchText('');
                                                                        setIsTemplateDropdownOpen(false);
                                                                    }}
                                                                    className="p-3 hover:bg-blue-50 cursor-pointer border-b border-slate-50 last:border-0 flex items-center space-x-3 transition-colors"
                                                                >
                                                                    {t.image ? <img src={t.image} className="w-10 h-10 rounded-lg object-cover shadow-sm"/> : <div className="w-10 h-10 bg-slate-100 rounded-lg flex items-center justify-center"><ImageIcon size={16}/></div>}
                                                                    <div>
                                                                        <div className="text-sm font-bold text-slate-800">{getTemplateDisplayName(t)}</div>
                                                                        <div className="text-xs text-slate-500">Nhập: {formatCurrency(t.importPrice)} | Bán: {formatCurrency(t.exportPrice)}</div>
                                                                    </div>
                                                                </div>
                                                            )) : <div className="p-4 text-center text-sm text-slate-400">Không tìm thấy mẫu nào</div>}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                            <div className="md:col-span-2"><label className="block text-sm font-semibold text-slate-700 mb-1.5">Số lượng *</label><input required type="number" min="1" value={inventoryForm.quantity} onChange={e => setInventoryForm({...inventoryForm, quantity: e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 font-bold" /></div>
                                            <div className="md:col-span-3"><label className="block text-sm font-semibold text-slate-700 mb-1.5">Trạng thái vận chuyển</label>
                                                <select value={inventoryForm.status} onChange={e => setInventoryForm({...inventoryForm, status: e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 font-medium text-slate-700">
                                                    <option>Đã về kho</option><option>Đang vận chuyển</option><option>Hàng chưa về</option>
                                                </select>
                                            </div>
                                            <div className="md:col-span-3"><label className="block text-sm font-semibold text-slate-700 mb-1.5">Thanh toán NCC</label>
                                                <select value={inventoryForm.payment} onChange={e => setInventoryForm({...inventoryForm, payment: e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 font-medium text-slate-700">
                                                    <option>Thanh toán online</option><option>Thanh toán tiền mặt</option><option>Chưa thanh toán</option>
                                                </select>
                                            </div>
                                            
                                            <div className="md:col-span-3"><label className="block text-sm font-semibold text-slate-700 mb-1.5">Giá nhập thực tế</label><input required type="number" min="0" value={inventoryForm.costPrice} onChange={e => setInventoryForm({...inventoryForm, costPrice: e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500" /></div>
                                            <div className="md:col-span-3"><label className="block text-sm font-semibold text-blue-600 mb-1.5">Giá bán chốt</label><input required type="number" min="0" value={inventoryForm.sellingPrice} onChange={e => setInventoryForm({...inventoryForm, sellingPrice: e.target.value})} className="w-full p-3 bg-blue-50 border border-blue-200 rounded-xl outline-none focus:border-blue-500 text-blue-700 font-bold" /></div>
                                            <div className="md:col-span-6 flex items-end"><button type="submit" className="w-full bg-slate-900 text-white py-3 rounded-xl font-bold hover:bg-slate-800 transition-all shadow-md hover:shadow-lg">Xác nhận Nhập kho</button></div>
                                        </form>
                                    </div>

                                    <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                                        <div className="p-6 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-slate-50/50">
                                            <h3 className="font-bold text-lg">Tồn kho hiện tại</h3>
                                            <div className="relative w-full sm:w-80">
                                                <Search className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" size={18} />
                                                <input type="text" placeholder="Tìm sản phẩm trong kho..." value={searchTerms.inventory} onChange={(e) => setSearchTerms({...searchTerms, inventory: e.target.value})} className="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500 text-sm transition-all shadow-sm" />
                                            </div>
                                        </div>
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left border-collapse min-w-[800px]">
                                                <thead><tr className="bg-white text-slate-400 text-xs uppercase tracking-wider border-b border-slate-100">
                                                    <th className="p-4 font-bold">Sản phẩm</th>
                                                    <th className="p-4 font-bold text-center">Số lượng</th>
                                                    <th className="p-4 font-bold">Tình trạng</th>
                                                    <th className="p-4 font-bold text-right">Tài chính</th>
                                                    <th className="p-4 font-bold text-center">Thao tác</th>
                                                </tr></thead>
                                                <tbody className="divide-y divide-slate-100">
                                                    {filteredInventory.length === 0 ? <tr><td colSpan="5" className="p-12 text-center text-slate-400"><PackagePlus className="w-12 h-12 mx-auto mb-3 opacity-20"/>Kho đang trống hoặc không tìm thấy.</td></tr> : 
                                                    filteredInventory.map(inv => {
                                                        const t = getTemplate(inv.templateId);
                                                        return (
                                                        <tr key={inv.id} className={`hover:bg-slate-50 transition-colors group ${inv.quantity === 0 ? 'opacity-50' : ''}`}>
                                                            <td className="p-4 flex items-center space-x-4">
                                                                {t?.image ? <img src={t.image} alt="thumb" className="w-12 h-12 object-cover rounded-xl shadow-sm border border-slate-100 shrink-0" /> : <div className="w-12 h-12 bg-slate-100 rounded-xl flex items-center justify-center text-slate-300 shrink-0"><ImageIcon size={20}/></div>}
                                                                <div>
                                                                    <p className="font-bold text-slate-800 text-base">{getTemplateDisplayName(t)}</p>
                                                                    <p className="text-xs text-slate-500 mt-0.5">{getTemplateDetails(t)}</p>
                                                                </div>
                                                            </td>
                                                            <td className="p-4 text-center">
                                                                <span className={`px-3 py-1.5 rounded-lg font-black text-sm ${inv.quantity > 5 ? 'bg-slate-100 text-slate-700' : inv.quantity > 0 ? 'bg-orange-100 text-orange-700' : 'bg-rose-100 text-rose-700'}`}>
                                                                    {inv.quantity}
                                                                </span>
                                                            </td>
                                                            <td className="p-4">
                                                                <div className="flex flex-col space-y-1.5">
                                                                    <span className={`inline-flex items-center text-[11px] font-bold uppercase tracking-wide px-2 py-1 rounded-md w-fit whitespace-nowrap ${String(inv.status) === 'Đã về kho' ? 'bg-emerald-50 text-emerald-600' : 'bg-amber-50 text-amber-600'}`}>
                                                                        {String(inv.status) === 'Đã về kho' ? <CheckCircle2 size={12} className="mr-1"/> : <Clock size={12} className="mr-1"/>} {inv.status}
                                                                    </span>
                                                                    <span className="inline-flex items-center text-xs font-medium text-slate-500 whitespace-nowrap">
                                                                        {String(inv.payment || '').includes('Online') ? <CreditCard size={12} className="mr-1"/> : <Wallet size={12} className="mr-1"/>} {inv.payment}
                                                                    </span>
                                                                </div>
                                                            </td>
                                                            <td className="p-4 text-right whitespace-nowrap">
                                                                <p className="text-xs font-medium text-slate-400 line-through mb-0.5">{formatCurrency(inv.costPrice)}</p>
                                                                <p className="font-black text-blue-600">{formatCurrency(inv.sellingPrice)}</p>
                                                            </td>
                                                            <td className="p-4">
                                                                <div className="flex items-center justify-center space-x-2">
                                                                    {/* NÚT BÁN NGAY KHÔNG CÒN BỊ KHÓA NẾU HÀNG CHƯA VỀ */}
                                                                    <button disabled={inv.quantity === 0} onClick={() => setSellModal({ isOpen: true, item: inv, qty: 1, type: 'Ship COD', price: inv.sellingPrice })} 
                                                                        className="bg-slate-900 hover:bg-slate-800 disabled:opacity-30 disabled:hover:bg-slate-900 text-white px-4 py-2 rounded-xl text-sm font-bold transition-all shadow-sm hover:shadow-md whitespace-nowrap">
                                                                        Bán ngay
                                                                    </button>
                                                                    {/* NÚT CHỈNH SỬA MỚI */}
                                                                    <button onClick={() => openEditInvModal(inv)} className="p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-xl transition-all opacity-0 group-hover:opacity-100 focus:opacity-100" title="Chỉnh sửa">
                                                                        <Edit size={18}/>
                                                                    </button>
                                                                    <button onClick={() => { if(window.confirm('Chắc chắn muốn xóa lô hàng này?')) handleDeleteInventory(inv.id); }} className="p-2 text-slate-400 hover:text-rose-500 hover:bg-rose-50 rounded-xl transition-all opacity-0 group-hover:opacity-100 focus:opacity-100" title="Xóa">
                                                                        <Trash2 size={18}/>
                                                                    </button>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    )})}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                                )}

                                {/* ---------------- TAB 4: LỊCH SỬ ĐƠN ---------------- */}
                                {activeTab === 'sales' && (
                                <div className="space-y-6 animate-fade-in">
                                    <div><h2 className="text-3xl font-bold text-slate-900 tracking-tight">Lịch sử Giao dịch</h2><p className="text-slate-500 mt-1">Quản lý các đơn hàng đã xuất kho</p></div>
                                    <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left border-collapse min-w-[700px]">
                                                <thead><tr className="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b border-slate-100">
                                                    <th className="p-4 font-bold">Thời gian</th>
                                                    <th className="p-4 font-bold">Sản phẩm</th>
                                                    <th className="p-4 font-bold text-center">Hình thức</th>
                                                    <th className="p-4 font-bold text-right">Lãi ròng</th>
                                                    <th className="p-4 font-bold text-center">Xóa</th>
                                                </tr></thead>
                                                <tbody className="divide-y divide-slate-100">
                                                    {sales.length === 0 ? <tr><td colSpan="5" className="p-12 text-center text-slate-400"><History className="w-12 h-12 mx-auto mb-3 opacity-20"/>Chưa có đơn hàng nào được bán ra.</td></tr> : 
                                                    sales.map(sale => {
                                                        const t = getTemplate(sale.templateId);
                                                        const profit = (Number(sale.actualSellingPrice) - (Number(sale.costPrice) || 0)) * Number(sale.quantitySold);
                                                        return (
                                                            <tr key={sale.id} className="hover:bg-slate-50 transition-colors group">
                                                                <td className="p-4"><p className="font-semibold text-slate-600 text-sm">{formatDate(sale.saleDate)}</p></td>
                                                                <td className="p-4 flex items-center space-x-3">
                                                                    {t?.image ? <img src={t.image} alt="thumb" className="w-10 h-10 object-cover rounded-xl shadow-sm border border-slate-100 shrink-0" /> : <div className="w-10 h-10 bg-slate-100 rounded-xl flex items-center justify-center text-slate-300 shrink-0"><ImageIcon size={16}/></div>}
                                                                    <div>
                                                                        <p className="font-bold text-slate-800">{getTemplateDisplayName(t)}</p>
                                                                        <p className="text-xs text-blue-600 font-bold mt-0.5">Số lượng: {sale.quantitySold}</p>
                                                                    </div>
                                                                </td>
                                                                <td className="p-4 text-center">
                                                                    <span className={`inline-flex items-center text-xs px-2.5 py-1 rounded-full font-bold whitespace-nowrap ${String(sale.deliveryType) === 'Ship COD' ? 'bg-orange-100 text-orange-700' : 'bg-blue-100 text-blue-700'}`}>
                                                                        {String(sale.deliveryType) === 'Ship COD' ? <Truck size={12} className="mr-1"/> : <Store size={12} className="mr-1"/>} {sale.deliveryType}
                                                                    </span>
                                                                </td>
                                                                <td className="p-4 text-right font-black text-violet-600 text-lg">+{formatCurrency(profit)}</td>
                                                                <td className="p-4 text-center">
                                                                    <button onClick={() => handleDeleteSale(sale.id)} className="p-2 text-slate-300 hover:text-rose-500 hover:bg-rose-50 rounded-xl transition-all opacity-0 group-hover:opacity-100 focus:opacity-100" title="Xóa và hoàn kho">
                                                                        <Trash2 size={18}/>
                                                                    </button>
                                                                </td>
                                                            </tr>
                                                        )
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                                )}

                                {/* ---------------- TAB 5: ĐỒNG BỘ CLOUD ---------------- */}
                                {activeTab === 'sync' && (
                                <div className="space-y-6 animate-fade-in max-w-2xl mx-auto pb-10">
                                    <div className="text-center mb-8">
                                        <h2 className="text-3xl font-black text-slate-900 tracking-tight">Dữ liệu Đám mây</h2>
                                        <p className="text-slate-500 mt-2">Sao lưu an toàn, không lo mất dữ liệu</p>
                                    </div>
                                    <div className="bg-slate-900 p-8 md:p-10 rounded-[2rem] shadow-2xl shadow-blue-900/20 text-white relative overflow-hidden">
                                        <div className="absolute top-0 right-0 p-8 opacity-10 pointer-events-none"><CloudLightning className="w-48 h-48"/></div>
                                        <div className="relative z-10">
                                            <div className="flex items-center space-x-4 mb-8">
                                                <div className="p-3 bg-blue-500/20 rounded-2xl"><CloudLightning className="w-8 h-8 text-blue-400" /></div>
                                                <h3 className="text-2xl font-bold">Google Apps Script</h3>
                                            </div>
                                            <div className="space-y-5">
                                                <div>
                                                    <label className="block text-xs font-bold uppercase tracking-widest text-slate-400 mb-2">Đường dẫn Web App API</label>
                                                    <div className="flex flex-col sm:flex-row gap-3">
                                                        <input type="text" value={syncUrl} onChange={(e) => setSyncUrl(e.target.value)} placeholder="https://script.google.com/macros/s/..." className="flex-1 px-5 py-4 border-none rounded-2xl outline-none text-slate-900 bg-white font-medium focus:ring-4 focus:ring-blue-500/30 transition-all shadow-inner" />
                                                        <button onClick={handleSaveSyncUrl} className="px-8 py-4 bg-blue-600 text-white rounded-2xl font-bold shadow-lg shadow-blue-600/30 hover:bg-blue-500 hover:-translate-y-0.5 transition-all whitespace-nowrap">Lưu Link</button>
                                                    </div>
                                                </div>
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-6 border-t border-slate-800">
                                                    <button onClick={syncToCloud} className="py-5 bg-emerald-500 text-white rounded-2xl font-bold shadow-lg shadow-emerald-500/20 hover:bg-emerald-400 hover:-translate-y-0.5 transition-all flex items-center justify-center space-x-2">
                                                        <UploadCloud /> <span>Đẩy dữ liệu lên</span>
                                                    </button>
                                                    <button onClick={syncFromCloud} className="py-5 bg-white/10 text-white border border-white/20 rounded-2xl font-bold hover:bg-white/20 hover:-translate-y-0.5 transition-all flex items-center justify-center space-x-2 backdrop-blur-sm">
                                                        <DownloadCloud /> <span>Tải dữ liệu về</span>
                                                    </button>
                                                </div>
                                            </div>
                                            {syncStatus.message && (
                                                <div className={`mt-8 py-3 px-4 rounded-xl text-sm font-bold text-center border bg-white/5 backdrop-blur-md ${syncStatus.type.includes('emerald') ? 'border-emerald-500/30 text-emerald-400' : syncStatus.type.includes('rose') ? 'border-rose-500/30 text-rose-400' : 'border-indigo-500/30 text-indigo-400'} ${syncStatus.type}`}>
                                                    {syncStatus.message}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                    
                                    <div className="flex flex-col items-center pt-8">
                                        <p className="text-sm text-slate-500 mb-4 font-medium">Sao lưu ngoại tuyến (Offline Backup)</p>
                                        <button onClick={exportBackupData} className="text-slate-700 hover:text-blue-700 flex items-center space-x-2 font-bold bg-white px-6 py-3 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md hover:border-blue-200 transition-all">
                                            <Save className="w-5 h-5" /> <span>Tải file JSON về máy</span>
                                        </button>
                                    </div>
                                </div>
                                )}

                            </div>
                        </div>

                        {/* ---------------- MODAL BÁN HÀNG ---------------- */}
                        {sellModal.isOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 animate-fade-in">
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden animate-slide-up border border-slate-100">
                                <div className="p-6 border-b border-slate-100 bg-slate-50 flex items-start justify-between">
                                    <div className="flex items-center space-x-4">
                                        {getTemplate(sellModal.item.templateId)?.image ? 
                                            <img src={getTemplate(sellModal.item.templateId).image} className="w-12 h-12 rounded-xl shadow-sm object-cover border border-slate-200" alt="item"/> : 
                                            <div className="w-12 h-12 rounded-xl bg-slate-200 flex items-center justify-center"><ImageIcon className="text-slate-400"/></div>
                                        }
                                        <div>
                                            <h3 className="font-black text-lg text-slate-800">Xác nhận chốt đơn</h3>
                                            <p className="text-sm text-slate-500 font-medium mt-0.5 line-clamp-1">{getTemplateDisplayName(getTemplate(sellModal.item.templateId))}</p>
                                        </div>
                                    </div>
                                    <button onClick={() => setSellModal({isOpen: false})} className="p-2 bg-slate-200 text-slate-500 rounded-full hover:bg-slate-300 transition-colors"><X size={16}/></button>
                                </div>
                                <form onSubmit={handleSell} className="p-6 space-y-5">
                                    <div className="grid grid-cols-2 gap-5">
                                        <div>
                                            <label className="block text-sm font-bold text-slate-700 mb-1.5">Số lượng bán</label>
                                            <input type="number" min="1" max={sellModal.item.quantity} value={sellModal.qty} onChange={e => setSellModal({...sellModal, qty: e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 font-bold text-lg text-center transition-all" />
                                            <p className="text-xs font-semibold text-orange-600 mt-1.5 text-center">Tồn kho: {sellModal.item.quantity}</p>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold text-slate-700 mb-1.5">Giá bán (VNĐ)</label>
                                            <input type="number" required value={sellModal.price} onChange={e => setSellModal({...sellModal, price: e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 font-bold text-lg text-blue-700 transition-all" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-2">Hình thức giao dịch</label>
                                        <div className="grid grid-cols-2 gap-3">
                                            <button type="button" onClick={() => setSellModal({...sellModal, type: 'Ship COD'})} className={`p-4 rounded-2xl border-2 flex flex-col items-center justify-center transition-all ${sellModal.type === 'Ship COD' ? 'border-orange-500 bg-orange-50 text-orange-700 shadow-md' : 'border-slate-100 bg-white text-slate-400 hover:bg-slate-50 hover:border-slate-200'}`}>
                                                <Truck size={28} className="mb-2" />
                                                <span className="text-sm font-bold">Ship COD</span>
                                            </button>
                                            <button type="button" onClick={() => setSellModal({...sellModal, type: 'Giao dịch trực tiếp'})} className={`p-4 rounded-2xl border-2 flex flex-col items-center justify-center transition-all ${sellModal.type === 'Giao dịch trực tiếp' ? 'border-blue-500 bg-blue-50 text-blue-700 shadow-md' : 'border-slate-100 bg-white text-slate-400 hover:bg-slate-50 hover:border-slate-200'}`}>
                                                <Store size={28} className="mb-2" />
                                                <span className="text-sm font-bold text-center">Giao dịch trực tiếp</span>
                                            </button>
                                        </div>
                                    </div>
                                    <div className="pt-2">
                                        <button type="submit" className="w-full py-4 bg-slate-900 text-white font-bold rounded-2xl hover:bg-slate-800 shadow-xl shadow-slate-900/20 hover:-translate-y-0.5 transition-all text-lg">Xác nhận bán hàng</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                        )}

                        {/* ---------------- MODAL SỬA LÔ HÀNG ---------------- */}
                        {editInvModal.isOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 animate-fade-in overflow-y-auto">
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden animate-slide-up border border-slate-100 my-auto">
                                <div className="p-6 border-b border-slate-100 bg-slate-50 flex items-center justify-between">
                                    <h3 className="font-black text-xl text-slate-800">Chỉnh sửa Lô hàng</h3>
                                    <button onClick={() => setEditInvModal({isOpen: false, item: null, template: null, form: {}})} className="p-2 bg-slate-200 text-slate-500 rounded-full hover:bg-slate-300 transition-colors"><X size={16}/></button>
                                </div>
                                <form onSubmit={handleEditInventorySubmit} className="p-6 space-y-5">
                                    <div className="flex space-x-4 items-center bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                        <label className="relative group cursor-pointer block">
                                            {editInvModal.form.image ? 
                                                <img src={editInvModal.form.image} className="w-16 h-16 rounded-xl object-cover border border-slate-200" alt="item"/> : 
                                                <div className="w-16 h-16 rounded-xl bg-white border border-slate-200 flex items-center justify-center"><ImageIcon className="text-slate-400"/></div>
                                            }
                                            <div className="absolute inset-0 bg-black/40 rounded-xl flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                                <Edit size={16} className="text-white"/>
                                            </div>
                                            <input type="file" accept="image/*" className="hidden" onChange={handleEditModalImageChange} />
                                        </label>
                                        <div className="flex-1">
                                            <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Tên / Mã SP</label>
                                            <input required type="text" value={editInvModal.template?.category === 'Keycap' ? editInvModal.form.name : editInvModal.form.model} 
                                                onChange={e => {
                                                    if (editInvModal.template?.category === 'Keycap') setEditInvModal(prev => ({...prev, form: {...prev.form, name: e.target.value}}));
                                                    else setEditInvModal(prev => ({...prev, form: {...prev.form, model: e.target.value}}));
                                                }}
                                                className="w-full p-2.5 bg-white border border-slate-200 rounded-xl outline-none focus:border-blue-500 font-bold text-slate-800 transition-all text-sm" 
                                            />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div><label className="block text-sm font-bold text-slate-700 mb-1">Số lượng tồn</label>
                                            <input required type="number" min="0" value={editInvModal.form.quantity} onChange={e => setEditInvModal(prev => ({...prev, form: {...prev.form, quantity: e.target.value}}))} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 font-bold transition-all" />
                                        </div>
                                        <div><label className="block text-sm font-bold text-slate-700 mb-1">Trạng thái kho</label>
                                            <select value={editInvModal.form.status} onChange={e => setEditInvModal(prev => ({...prev, form: {...prev.form, status: e.target.value}}))} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 font-medium transition-all">
                                                <option>Đã về kho</option><option>Đang vận chuyển</option><option>Hàng chưa về</option>
                                            </select>
                                        </div>
                                        <div><label className="block text-sm font-bold text-slate-700 mb-1">Giá nhập (VNĐ)</label>
                                            <input required type="number" min="0" value={editInvModal.form.costPrice} onChange={e => setEditInvModal(prev => ({...prev, form: {...prev.form, costPrice: e.target.value}}))} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 transition-all" />
                                        </div>
                                        <div><label className="block text-sm font-bold text-slate-700 mb-1">Giá bán (VNĐ)</label>
                                            <input required type="number" min="0" value={editInvModal.form.sellingPrice} onChange={e => setEditInvModal(prev => ({...prev, form: {...prev.form, sellingPrice: e.target.value}}))} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 font-bold text-blue-700 transition-all" />
                                        </div>
                                        <div className="col-span-2"><label className="block text-sm font-bold text-slate-700 mb-1">Trạng thái thanh toán (NCC)</label>
                                            <select value={editInvModal.form.payment} onChange={e => setEditInvModal(prev => ({...prev, form: {...prev.form, payment: e.target.value}}))} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 font-medium transition-all">
                                                <option>Thanh toán online</option><option>Thanh toán tiền mặt</option><option>Chưa thanh toán</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div className="bg-emerald-50 border border-emerald-100 rounded-xl p-4 flex justify-between items-center">
                                        <span className="text-sm font-bold text-emerald-800">Lãi ròng dự kiến (tổng lô hàng):</span>
                                        <span className="font-black text-emerald-600 text-lg">
                                            {formatCurrency((Number(editInvModal.form.sellingPrice) - Number(editInvModal.form.costPrice)) * Number(editInvModal.form.quantity))}
                                        </span>
                                    </div>

                                    <div className="pt-2">
                                        <button type="submit" className="w-full py-4 bg-blue-600 text-white font-bold rounded-2xl hover:bg-blue-700 shadow-xl shadow-blue-600/20 hover:-translate-y-0.5 transition-all text-lg">Lưu thông tin</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                        )}

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
