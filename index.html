<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GearShop Manager - Pro Edition</title>
    <!-- Thư viện TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Thư viện Icon -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 flex h-screen overflow-hidden">

    <!-- Sidebar PC -->
    <div class="w-64 bg-white border-r border-slate-200 flex flex-col hidden md:flex shrink-0 shadow-sm z-10">
        <div class="p-6 border-b border-slate-100 flex items-center space-x-3">
            <div class="bg-indigo-600 p-2 rounded-xl text-white shadow-md shadow-indigo-200">
                <i data-lucide="monitor-speaker"></i>
            </div>
            <h1 class="text-xl font-black bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-violet-600 tracking-tight">GearShop Pro</h1>
        </div>
        <nav class="flex-1 p-4 space-y-1.5 overflow-y-auto">
            <button onclick="switchTab('dashboard')" id="tab-dashboard" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all bg-indigo-50 text-indigo-700 font-bold">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i> <span>Tổng quan</span>
            </button>
            <button onclick="switchTab('templates')" id="tab-templates" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all text-slate-500 hover:bg-slate-100 font-medium">
                <i data-lucide="layout-template" class="w-5 h-5"></i> <span>Mẫu Sản Phẩm</span>
            </button>
            <button onclick="switchTab('inventory')" id="tab-inventory" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all text-slate-500 hover:bg-slate-100 font-medium">
                <i data-lucide="package" class="w-5 h-5"></i> <span>Quản lý Kho</span>
            </button>
            <button onclick="switchTab('transactions')" id="tab-transactions" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all text-slate-500 hover:bg-slate-100 font-medium">
                <i data-lucide="history" class="w-5 h-5"></i> <span>Lịch sử Bán Hàng</span>
            </button>
            <div class="pt-4 pb-2"><div class="h-px bg-slate-100 w-full"></div></div>
            <button onclick="switchTab('sync')" id="tab-sync" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all text-slate-500 hover:bg-slate-100 font-medium">
                <i data-lucide="cloud-sync" class="w-5 h-5"></i> <span>Đồng bộ Cloud</span>
            </button>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden relative">
        <!-- Header Mobile -->
        <div class="md:hidden bg-white p-4 border-b flex justify-between items-center shrink-0 z-10 shadow-sm">
            <h1 class="text-lg font-black text-indigo-600 flex items-center"><i data-lucide="monitor-speaker" class="w-5 h-5 mr-2"></i> GearShop Pro</h1>
            <div class="flex space-x-1">
                <button onclick="switchTab('dashboard')" class="p-2 rounded-lg bg-indigo-50 text-indigo-600"><i data-lucide="layout-dashboard" class="w-5 h-5"></i></button>
                <button onclick="switchTab('templates')" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100"><i data-lucide="layout-template" class="w-5 h-5"></i></button>
                <button onclick="switchTab('inventory')" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100"><i data-lucide="package" class="w-5 h-5"></i></button>
            </div>
        </div>

        <main id="main-content" class="flex-1 overflow-x-hidden overflow-y-auto bg-slate-50 p-4 md:p-8">
            <!-- Nội dung thay đổi ở đây -->
        </main>
    </div>

    <!-- ========================================== -->
    <!-- MODAL 1: TẠO/SỬA MẪU SẢN PHẨM (TEMPLATES)  -->
    <!-- ========================================== -->
    <div id="modal-template" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden fade-in my-8">
            <div class="flex justify-between items-center p-5 border-b border-slate-100 bg-slate-50/80">
                <h3 id="mt-title" class="text-lg font-bold text-slate-800">Tạo Mẫu Sản Phẩm Mới</h3>
                <button type="button" onclick="closeModal('modal-template')" class="text-slate-400 hover:text-rose-500 transition-colors"><i data-lucide="x"></i></button>
            </div>
            <form id="form-template" onsubmit="handleSaveTemplate(event)" class="p-6 space-y-5">
                <input type="hidden" id="mt-id">
                
                <!-- Ảnh minh họa -->
                <div class="flex items-center space-x-4">
                    <div id="mt-image-preview" class="w-16 h-16 bg-slate-100 rounded-xl flex items-center justify-center overflow-hidden border border-slate-200 shrink-0">
                        <i data-lucide="image" class="text-slate-400"></i>
                    </div>
                    <div class="flex-1">
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Ảnh minh họa</label>
                        <input type="file" id="mt-image-upload" accept="image/*" onchange="previewTemplateImage(event)" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-indigo-50 file:text-indigo-600 hover:file:bg-indigo-100 cursor-pointer" />
                        <input type="hidden" id="mt-image-base64">
                    </div>
                </div>

                <!-- Danh mục Form Thông minh -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Danh mục sản phẩm *</label>
                    <select id="mt-category" onchange="toggleTemplateFields()" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none bg-white font-medium">
                        <option value="Bàn phím">Bàn phím cơ</option>
                        <option value="Chuột">Chuột</option>
                        <option value="Keycap">Keycap</option>
                        <option value="Tai nghe">Tai nghe</option>
                        <option value="Phụ kiện">Khác / Phụ kiện</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Hãng (Brand) *</label>
                        <input required type="text" id="mt-brand" placeholder="Vd: Aula, Logitech..." class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" />
                    </div>
                    <div>
                        <!-- Tên thay đổi theo danh mục -->
                        <label id="lbl-mt-model" class="block text-sm font-bold text-slate-700 mb-1">Mã SP (Model) *</label>
                        <input required type="text" id="mt-model" placeholder="Vd: F75, G102..." class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" />
                    </div>
                </div>

                <!-- Các trường linh hoạt -->
                <div id="dynamic-fields-container" class="grid grid-cols-2 gap-4 bg-slate-50 p-4 rounded-xl border border-slate-100">
                    <!-- Bàn phím Fields -->
                    <div class="df-keyboard col-span-1">
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Switch (Trục)</label>
                        <input type="text" id="mt-switch" placeholder="Vd: Reaper, TTC..." class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none text-sm" />
                    </div>
                    
                    <!-- Chuột Fields -->
                    <div class="df-mouse col-span-1 hidden">
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Kết nối</label>
                        <select id="mt-connection" class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none text-sm bg-white">
                            <option value="3 Mode (Dây/2.4G/BT)">3 Mode (Dây/2.4G/BT)</option>
                            <option value="Không dây 2.4G">Không dây 2.4G</option>
                            <option value="Có dây">Có dây</option>
                            <option value="Bluetooth">Bluetooth</option>
                        </select>
                    </div>

                    <!-- Keycap Fields -->
                    <div class="df-keycap col-span-1 hidden">
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Profile</label>
                        <select id="mt-profile" class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none text-sm bg-white">
                            <option value="Cherry">Cherry</option>
                            <option value="OEM">OEM</option>
                            <option value="XDA">XDA</option>
                            <option value="MDA">MDA</option>
                            <option value="SA">SA</option>
                            <option value="Khác">Khác</option>
                        </select>
                    </div>

                    <!-- Chung cho Phím/Chuột -->
                    <div class="df-color col-span-1">
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Màu sắc</label>
                        <input type="text" id="mt-color" placeholder="Vd: Trắng, Đen..." class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none text-sm" />
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 pt-2">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Giá nhập dự kiến</label>
                        <input required type="number" min="0" id="mt-import-price" class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-slate-600" />
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Giá bán đề xuất</label>
                        <input required type="number" min="0" id="mt-export-price" class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none font-bold text-indigo-700" />
                    </div>
                </div>

                <div class="pt-4 flex justify-end space-x-3">
                    <button type="button" onclick="closeModal('modal-template')" class="px-5 py-2.5 text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl font-bold transition-colors">Hủy</button>
                    <button type="submit" class="px-6 py-2.5 text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl font-bold shadow-md shadow-indigo-200 transition-all">Lưu Mẫu</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- MODAL 2: NHẬP KHO (INVENTORY IMPORT)       -->
    <!-- ========================================== -->
    <div id="modal-import" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden fade-in my-8 border border-emerald-100">
            <div class="flex justify-between items-center p-5 border-b border-emerald-100 bg-emerald-50">
                <h3 class="text-lg font-bold text-emerald-800 flex items-center"><i data-lucide="package-plus" class="w-5 h-5 mr-2"></i> Nhập Hàng Vào Kho</h3>
                <button type="button" onclick="closeModal('modal-import')" class="text-emerald-400 hover:text-emerald-600"><i data-lucide="x"></i></button>
            </div>
            <form id="form-import" onsubmit="handleImportInventory(event)" class="p-6 space-y-4">
                
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Chọn sản phẩm từ Mẫu *</label>
                    <select required id="mi-template-id" onchange="autoFillImportPrice()" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none bg-white font-medium text-slate-800">
                        <!-- Đổ dữ liệu templates vào đây -->
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Số lượng nhập *</label>
                        <input required type="number" min="1" id="mi-qty" value="1" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none font-black text-center text-lg" />
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Giá nhập thực tế *</label>
                        <input required type="number" min="0" id="mi-price" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none font-bold text-rose-600" />
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 pt-2">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Tình trạng hàng</label>
                        <select id="mi-arrival" class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none text-sm bg-white font-medium">
                            <option value="Đã về kho">🟢 Đã về kho</option>
                            <option value="Chưa về kho">🟡 Chưa về kho (Đang vận chuyển)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Dòng tiền</label>
                        <select id="mi-payment" class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none text-sm bg-white font-medium">
                            <option value="Đã thanh toán">💳 Đã thanh toán (Online)</option>
                            <option value="Thanh toán khi nhận">📦 Trả tiền khi nhận (COD)</option>
                        </select>
                    </div>
                </div>

                <div class="pt-5 flex justify-end space-x-3">
                    <button type="button" onclick="closeModal('modal-import')" class="px-5 py-2.5 text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl font-bold transition-colors">Hủy</button>
                    <button type="submit" class="px-6 py-2.5 text-white bg-emerald-600 hover:bg-emerald-700 rounded-xl font-bold shadow-md shadow-emerald-200 transition-all">Xác nhận Nhập</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- MODAL 3: XUẤT BÁN (SELL)                   -->
    <!-- ========================================== -->
    <div id="modal-sell" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden fade-in border border-indigo-100">
            <div class="flex justify-between items-center p-5 border-b border-indigo-100 bg-indigo-50">
                <h3 class="text-lg font-bold text-indigo-800 flex items-center"><i data-lucide="shopping-cart" class="w-5 h-5 mr-2"></i> Chốt Đơn (Bán Hàng)</h3>
                <button type="button" onclick="closeModal('modal-sell')" class="text-indigo-400 hover:text-indigo-600"><i data-lucide="x"></i></button>
            </div>
            <form id="form-sell" onsubmit="handleSell(event)" class="p-6 space-y-5">
                <input type="hidden" id="ms-inv-id">
                <input type="hidden" id="ms-cost-price">
                
                <div id="ms-error" class="hidden p-3 bg-rose-50 border border-rose-200 text-rose-700 text-sm rounded-xl font-bold text-center"></div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Sản phẩm xuất bán</label>
                    <div id="ms-product-name" class="w-full px-4 py-3 border border-slate-200 rounded-xl bg-slate-50 text-slate-700 text-sm font-medium"></div>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Số lượng xuất *</label>
                        <input required type="number" min="1" id="ms-qty" value="1" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none font-black text-center text-lg text-indigo-700" />
                        <p id="ms-stock-hint" class="text-[11px] text-slate-500 mt-1.5 font-medium text-center"></p>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Giá chốt thực tế *</label>
                        <input required type="number" min="0" id="ms-price" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none font-bold text-emerald-600" />
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Hình thức giao / nhận tiền</label>
                    <select id="ms-method" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none bg-white font-medium">
                        <option value="Ship COD">🚚 Ship COD (Thu hộ)</option>
                        <option value="Chuyển khoản trước">💳 Chuyển khoản trước</option>
                        <option value="Giao dịch trực tiếp">🤝 Giao dịch trực tiếp (Tiền mặt)</option>
                    </select>
                </div>

                <div class="pt-2 flex justify-end space-x-3">
                    <button type="button" onclick="closeModal('modal-sell')" class="px-5 py-2.5 text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl font-bold transition-colors">Hủy</button>
                    <button type="submit" class="px-6 py-2.5 text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl font-bold shadow-md shadow-indigo-200 transition-all">Xác nhận Bán</button>
                </div>
            </form>
        </div>
    </div>

    <!-- === JAVASCRIPT LOGIC === -->
    <script>
        // --- 1. DỮ LIỆU CỐT LÕI ---
        let templates = JSON.parse(localStorage.getItem('gs_templates')) || [];
        // Inventory lưu các lô hàng thực tế nhập về
        let inventory = JSON.parse(localStorage.getItem('gs_inventory')) || [];
        // Transactions chỉ lưu Lịch sử bán ra (để báo cáo)
        let transactions = JSON.parse(localStorage.getItem('gs_sales')) || [];
        let activeTab = 'dashboard';

        function saveData() {
            localStorage.setItem('gs_templates', JSON.stringify(templates));
            localStorage.setItem('gs_inventory', JSON.stringify(inventory));
            localStorage.setItem('gs_sales', JSON.stringify(transactions));
        }

        // --- 2. TIỆN ÍCH ---
        const formatMoney = (amount) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);
        const formatDate = (dateStr) => {
            const d = new Date(dateStr);
            return `${d.toLocaleDateString('vi-VN')} ${d.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'})}`;
        };
        
        // Render Tên từ Template
        const getTmplName = (t) => {
            if(!t) return 'Lỗi dữ liệu';
            if(t.category === 'Bàn phím') return `[Bàn phím] ${t.brand} ${t.model} - ${t.switchType} - Màu ${t.color}`;
            if(t.category === 'Chuột') return `[Chuột] ${t.brand} ${t.model} (${t.connection}) - Màu ${t.color}`;
            if(t.category === 'Keycap') return `[Keycap] ${t.brand} ${t.profile} - ${t.model}`;
            return `[${t.category}] ${t.brand} ${t.model} - ${t.color}`;
        };

        function initIcons() { lucide.createIcons(); }

        // --- 3. ĐIỀU HƯỚNG ---
        function switchTab(tab) {
            activeTab = tab;
            ['dashboard', 'templates', 'inventory', 'transactions', 'sync'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if(btn) {
                    btn.className = (t === tab) 
                        ? "w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all bg-indigo-100/60 text-indigo-700 font-bold shadow-sm"
                        : "w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all text-slate-500 hover:bg-slate-100 hover:text-slate-800 font-medium";
                }
            });
            render();
        }

        // --- 4. RENDER GIAO DIỆN ---
        function render() {
            const content = document.getElementById('main-content');
            if(activeTab === 'dashboard') content.innerHTML = renderDashboard();
            else if(activeTab === 'templates') content.innerHTML = renderTemplates();
            else if(activeTab === 'inventory') content.innerHTML = renderInventory();
            else if(activeTab === 'transactions') content.innerHTML = renderTransactions();
            else if(activeTab === 'sync') content.innerHTML = renderSync();
            initIcons();
        }

        // ---------- TAB TỔNG QUAN (DASHBOARD) ----------
        function renderDashboard() {
            // Logic lọc thời gian
            const now = new Date();
            const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
            const day = now.getDay(); const diff = now.getDate() - day + (day === 0 ? -6 : 1);
            const startOfWeek = new Date(now.setDate(diff)).setHours(0,0,0,0);
            const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
            const startOfYear = new Date(now.getFullYear(), 0, 1).getTime();

            // Tính Vốn & Tồn kho hiện tại
            let totalStockQty = 0;
            let currentCapital = 0;
            inventory.forEach(item => {
                if(item.currentQty > 0) {
                    totalStockQty += item.currentQty;
                    currentCapital += (item.actualImportPrice * item.currentQty);
                }
            });

            // Tính Lợi nhuận theo các mốc
            const calcProfit = (startTime) => transactions
                .filter(t => new Date(t.timestamp).getTime() >= startTime)
                .reduce((sum, t) => sum + t.profit, 0);

            const calcRev = (startTime) => transactions
                .filter(t => new Date(t.timestamp).getTime() >= startTime)
                .reduce((sum, t) => sum + (t.salePrice * t.qty), 0);

            const profitAll = transactions.reduce((sum, t) => sum + t.profit, 0);
            const revAll = transactions.reduce((sum, t) => sum + (t.salePrice * t.qty), 0);

            return `
                <div class="space-y-6 fade-in max-w-6xl mx-auto pb-10">
                    <h2 class="text-2xl font-black text-slate-800 tracking-tight">Báo Cáo Tổng Quan</h2>
                    
                    <!-- Dòng tiền & Tồn kho (Quick Stats) -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="bg-gradient-to-br from-indigo-600 to-violet-600 p-6 rounded-2xl shadow-lg text-white flex justify-between items-center relative overflow-hidden">
                            <div class="absolute right-[-20px] top-[-20px] opacity-10"><i data-lucide="wallet" class="w-32 h-32"></i></div>

                                    <button onclick="saveSyncUrl()" class="px-6 py-3 bg-indigo-800 text-white border border-indigo-500 rounded-xl font-bold shadow-sm hover:bg-indigo-900 transition-colors">LƯU LINK</button>

        // --- 5. LOGIC ĐỒNG BỘ ---
        function saveSyncUrl() {
            localStorage.setItem('gearShop_syncUrl', document.getElementById('sync-url').value.trim());
            alertMessage('Đã lưu link kết nối thành công!', 'white');
        }

        async function syncToCloud() {
            const url = localStorage.getItem('gearShop_syncUrl');
            if(!url) return alertMessage('Vui lòng lưu link API trước!', 'white');
            const statusEl = document.getElementById('sync-status');
            statusEl.textContent = 'Đang đồng bộ lên Google Drive...'; statusEl.className = 'mt-6 text-sm font-bold text-center text-indigo-200 block animate-pulse';
            try {
                // Đẩy cả templates, inventory, transactions
                const response = await fetch(url, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
                    body: JSON.stringify({ inventory, transactions, templates }) 
                });
                const result = await response.json();
                if(result.status === 'success') alertMessage('Đồng bộ thành công rực rỡ! ✓', 'emerald-400');
            } catch (e) { 
                console.error(e);
                alertMessage('Lỗi kết nối. Hãy kiểm tra mạng hoặc link API.', 'rose-300'); 
            }
        }

        async function syncFromCloud() {
            const url = localStorage.getItem('gearShop_syncUrl');
            if(!url) return alertMessage('Vui lòng lưu link API trước!', 'white');
            if(!confirm('Dữ liệu từ Cloud sẽ GHI ĐÈ dữ liệu trên máy này. Chắc chắn muốn tiếp tục?')) return;
            const statusEl = document.getElementById('sync-status');
            statusEl.textContent = 'Đang tải dữ liệu về...'; statusEl.className = 'mt-6 text-sm font-bold text-center text-indigo-200 block animate-pulse';
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                // --- Xử lý tương thích ngược (Migrate data cũ) ---
                if(data.products && (!data.inventory || data.inventory.length === 0)) {
                    data.templates = [];
                    data.inventory = [];
                    data.products.forEach(p => {
                        const tmplId = 'tmpl_' + p.id;
                        data.templates.push({
                            id: tmplId, category: p.category, brand: p.brand || 'Khác',
                            model: p.model || 'Không tên', color: p.color || '',
                            switchType: p.switchType || '', plate: p.plate || '',
                            connection: '', profile: '',
                            importPrice: p.importPrice || 0, exportPrice: p.exportPrice || 0,
                            image: p.image || ''
                        });
                        // Chuyển hàng tồn thành Lô hàng mới
                        if (p.stock > 0) {
                            data.inventory.push({
                                id: 'inv_' + p.id, templateId: tmplId,
                                currentQty: p.stock, actualImportPrice: p.importPrice || 0,
                                arrivalStatus: 'Đã về kho', paymentStatus: 'Đã thanh toán',
                                dateAdded: new Date().toISOString()
                            });
                        }
                    });
                    
                    if(data.transactions) {
                        data.transactions.forEach(tx => {
                            tx.inventoryId = 'inv_' + tx.productId;
                            tx.qty = tx.quantity || tx.qty || 1;
                            tx.salePrice = tx.price || tx.salePrice || 0;
                            tx.shippingMethod = tx.shippingMethod || 'Giao dịch trực tiếp';
                        });
                    }
                }

                if(data.inventory || data.templates) { 
                    inventory = data.inventory || []; 
                    transactions = data.transactions || []; 
                    templates = data.templates || []; 
                    saveData(); 
                    render(); 
                    alertMessage('Đã nạp dữ liệu mới thành công!', 'emerald-400'); 
                } else {
                    alertMessage('Dữ liệu trên Cloud trống.', 'amber-300');
                }
            } catch (e) { 
                console.error(e);
                alertMessage('Lỗi tải dữ liệu. Có thể trên Cloud chưa có file.', 'rose-300'); 
            }
        }

        function exportBackupData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ inventory, transactions, templates }));
            const link = document.createElement('a');
            const date = new Date().toLocaleDateString('vi-VN').replace(/\//g,'-');
            link.setAttribute("href", dataStr); link.setAttribute("download", `GearBackup_${date}.json`); link.click();
        }

        // --- 6. LOGIC MODAL TẠO MẪU (TEMPLATE) ---
        function toggleTemplateFields() {
            const cat = document.getElementById('mt-category').value;
            document.querySelector('.df-keyboard').classList.toggle('hidden', cat !== 'Bàn phím');
            document.querySelector('.df-mouse').classList.toggle('hidden', cat !== 'Chuột');
            document.querySelector('.df-keycap').classList.toggle('hidden', cat !== 'Keycap');
            document.getElementById('lbl-mt-model').innerText = cat === 'Keycap' ? 'Tên / Chủ đề *' : 'Mã SP (Model) *';
        }

        function previewTemplateImage(e) {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const img = new Image(); img.onload = function() {
                        const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                        canvas.width = 300; canvas.height = img.height * (300/img.width);
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        const b64 = canvas.toDataURL("image/jpeg", 0.7);
                        document.getElementById('mt-image-base64').value = b64;
                        document.getElementById('mt-image-preview').innerHTML = `<img src="${b64}" class="w-full h-full object-cover"/>`;
                    }; img.src = ev.target.result;
                }; reader.readAsDataURL(file);
            }
        }

        function openTemplateModal(id = null) {
            document.getElementById('modal-template').classList.remove('hidden');
            document.getElementById('form-template').reset();
            document.getElementById('mt-image-base64').value = '';
            document.getElementById('mt-image-preview').innerHTML = `<i data-lucide="image" class="text-slate-400"></i>`;
            
            if(id) {
                const t = templates.find(x => x.id === id);
                document.getElementById('mt-title').innerText = 'Sửa Mẫu Sản Phẩm';
                document.getElementById('mt-id').value = t.id;
                document.getElementById('mt-category').value = t.category;
                document.getElementById('mt-brand').value = t.brand;
                document.getElementById('mt-model').value = t.model;
                document.getElementById('mt-color').value = t.color;
                document.getElementById('mt-switch').value = t.switchType || '';
                document.getElementById('mt-plate').value = t.plate || 'PC';
                document.getElementById('mt-connection').value = t.connection || '3 Mode (Dây/2.4G/BT)';
                document.getElementById('mt-profile').value = t.profile || 'Cherry';
                document.getElementById('mt-import-price').value = t.importPrice;
                document.getElementById('mt-export-price').value = t.exportPrice;
                if(t.image) {
                    document.getElementById('mt-image-base64').value = t.image;
                    document.getElementById('mt-image-preview').innerHTML = `<img src="${t.image}" class="w-full h-full object-cover"/>`;
                }
            } else {
                document.getElementById('mt-title').innerText = 'Tạo Mẫu Sản Phẩm Mới';
                document.getElementById('mt-id').value = '';
            }
            toggleTemplateFields(); initIcons();
        }

        function handleSaveTemplate(e) {
            e.preventDefault();
            const id = document.getElementById('mt-id').value;
            const cat = document.getElementById('mt-category').value;
            const tData = {
                category: cat, brand: document.getElementById('mt-brand').value,
                model: document.getElementById('mt-model').value, color: document.getElementById('mt-color').value,
                switchType: cat==='Bàn phím'?document.getElementById('mt-switch').value:'',
                plate: cat==='Bàn phím'?document.getElementById('mt-plate').value:'',
                connection: cat==='Chuột'?document.getElementById('mt-connection').value:'',
                profile: cat==='Keycap'?document.getElementById('mt-profile').value:'',
                importPrice: parseInt(document.getElementById('mt-import-price').value),
                exportPrice: parseInt(document.getElementById('mt-export-price').value),
                image: document.getElementById('mt-image-base64').value
            };
            if(id) {
                const idx = templates.findIndex(x => x.id === id);
                templates[idx] = { id, ...tData };
            } else {
                templates.unshift({ id: 'tmpl_'+Date.now(), ...tData });
            }
            saveData(); closeModal('modal-template'); render();
        }

        // --- 7. LOGIC NHẬP KHO (INVENTORY IMPORT) ---
        function openImportModal() {
            if(templates.length === 0) { alert('Vui lòng tạo Mẫu Sản Phẩm trước khi nhập hàng!'); switchTab('templates'); return; }
            document.getElementById('modal-import').classList.remove('hidden');
            document.getElementById('form-import').reset();
            
            const sel = document.getElementById('mi-template-id');
            sel.innerHTML = '<option value="">-- Chọn Mẫu --</option>';
            templates.forEach(t => sel.innerHTML += `<option value="${t.id}">${getTmplName(t)}</option>`);
        }

        function autoFillImportPrice() {
            const tid = document.getElementById('mi-template-id').value;
            if(!tid) return;
            const t = templates.find(x => x.id === tid);
            document.getElementById('mi-price').value = t.importPrice;
        }

        function handleImportInventory(e) {
            e.preventDefault();
            const invData = {
                id: 'inv_'+Date.now(),
                templateId: document.getElementById('mi-template-id').value,
                currentQty: parseInt(document.getElementById('mi-qty').value),
                actualImportPrice: parseInt(document.getElementById('mi-price').value),
                arrivalStatus: document.getElementById('mi-arrival').value,
                paymentStatus: document.getElementById('mi-payment').value,
                dateAdded: new Date().toISOString()
            };
            inventory.unshift(invData);
            saveData(); closeModal('modal-import'); render();
        }

        // --- 8. LOGIC XUẤT BÁN (SELL) ---
        function openSellModal(invId) {
            const inv = inventory.find(i => i.id === invId);
            const tmpl = templates.find(t => t.id === inv.templateId);
            
            document.getElementById('modal-sell').classList.remove('hidden');
            document.getElementById('ms-error').classList.add('hidden');
            document.getElementById('form-sell').reset();
            
            document.getElementById('ms-inv-id').value = inv.id;
            document.getElementById('ms-cost-price').value = inv.actualImportPrice;
            document.getElementById('ms-product-name').innerText = getTmplName(tmpl);
            document.getElementById('ms-qty').max = inv.currentQty;
            document.getElementById('ms-stock-hint').innerText = `Tối đa: ${inv.currentQty} cái`;
            document.getElementById('ms-price').value = tmpl.exportPrice; // Điền sẵn giá bán đề xuất
        }

        function handleSell(e) {
            e.preventDefault();
            const invId = document.getElementById('ms-inv-id').value;
            const qty = parseInt(document.getElementById('ms-qty').value);
            const salePrice = parseInt(document.getElementById('ms-price').value);
            const costPrice = parseInt(document.getElementById('ms-cost-price').value);
            const method = document.getElementById('ms-method').value;
            
            const invIdx = inventory.findIndex(i => i.id === invId);
            
            if(qty > inventory[invIdx].currentQty) {
                document.getElementById('ms-error').innerText = 'Lỗi: Không đủ hàng trong lô này!';
                document.getElementById('ms-error').classList.remove('hidden');
                return;
            }

            // Trừ tồn kho
            inventory[invIdx].currentQty -= qty;

            // Tính lợi nhuận thực tế lô này
            const profit = (salePrice - costPrice) * qty;

            transactions.unshift({
                id: 'tx_'+Date.now(), type: 'EXPORT', inventoryId: invId,
                qty: qty, salePrice: salePrice, shippingMethod: method,
                profit: profit, timestamp: new Date().toISOString()
            });

            saveData(); closeModal('modal-sell'); render();
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function alertMessage(msg, color) {
            const status = document.getElementById('sync-status');
            if(status) {
                status.innerText = msg; status.className = `mt-6 text-sm font-bold text-center text-${color} block`;
                setTimeout(() => status.classList.add('hidden'), 5000);
            }
        }
        
        // Khởi động
        render();
    </script>
</body>
</html>
