                        <div className="flex-1 overflow-auto bg-slate-50/50">
                            <div className="p-4 md:p-8 max-w-[1400px] mx-auto space-y-8 animate-fade-in">
                                
                                {/* ================= TAB 1: DASHBOARD ================= */}
                                {activeTab === 'dashboard' && (
                                <div className="space-y-6">
                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
                                        <div>
                                            <h2 className="text-3xl font-bold text-slate-900 tracking-tight">Tổng quan kinh doanh</h2>
                                            <p className="text-slate-500 mt-1">Báo cáo hiệu suất bán hàng của bạn</p>
                                        </div>
                                        <div className="bg-white p-1 rounded-xl shadow-sm border border-slate-200 flex space-x-1 overflow-x-auto max-w-full">
                                            {['day', 'week', 'month', 'year'].map(filter => (
                                                <button key={filter} onClick={() => setDashboardFilter(filter)} 
                                                    className={`px-4 py-2 rounded-lg text-sm font-semibold transition-all whitespace-nowrap ${dashboardFilter === filter ? 'bg-slate-900 text-white shadow-md' : 'text-slate-500 hover:bg-slate-100'}`}>
                                                    {filter === 'day' ? 'Hôm nay' : filter === 'week' ? 'Tuần này' : filter === 'month' ? 'Tháng này' : 'Năm nay'}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex items-center hover:shadow-md transition-shadow">
                                            <div className="p-4 bg-emerald-100 text-emerald-600 rounded-2xl mr-5">{DollarSign && <DollarSign size={28} />}</div>
                                            <div><p className="text-sm font-medium text-slate-500 mb-1">Doanh thu</p><h3 className="text-2xl font-black text-slate-800">{formatCurrency(dashboardStats.revenue)}</h3></div>
                                        </div>
                                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex items-center hover:shadow-md transition-shadow">
                                            <div className="p-4 bg-violet-100 text-violet-600 rounded-2xl mr-5">{TrendingUp && <TrendingUp size={28} />}</div>
                                            <div><p className="text-sm font-medium text-slate-500 mb-1">Lợi nhuận ròng</p><h3 className="text-2xl font-black text-violet-600">{formatCurrency(dashboardStats.profit)}</h3></div>
                                        </div>
                                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex items-center hover:shadow-md transition-shadow">
                                            <div className="p-4 bg-blue-100 text-blue-600 rounded-2xl mr-5">{Box && <Box size={28} />}</div>
                                            <div><p className="text-sm font-medium text-slate-500 mb-1">Sản phẩm đã bán</p><h3 className="text-2xl font-black text-slate-800">{dashboardStats.itemsSold} <span className="text-base font-medium text-slate-400">cái</span></h3></div>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mt-4">
                                        <div className="bg-gradient-to-br from-slate-900 to-slate-800 p-6 rounded-3xl shadow-lg border border-slate-800 flex items-center">
                                            <div className="p-4 bg-white/10 text-white rounded-2xl mr-5 backdrop-blur-sm">{Database && <Database size={28} />}</div>
                                            <div><p className="text-sm font-medium text-slate-300 mb-1">Vốn lưu động trong kho</p><h3 className="text-2xl font-black text-white">{formatCurrency(inventoryStats.totalCapital)}</h3></div>
                                        </div>
                                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex items-center hover:shadow-md transition-shadow">
                                            <div className="p-4 bg-orange-100 text-orange-600 rounded-2xl mr-5">{PackagePlus && <PackagePlus size={28} />}</div>
                                            <div><p className="text-sm font-medium text-slate-500 mb-1">Tồn kho hiện tại</p><h3 className="text-2xl font-black text-slate-800">{inventoryStats.totalStock} <span className="text-base font-medium text-slate-400">sản phẩm</span></h3></div>
                                        </div>
                                    </div>

                                    {/* Recent Sales List */}
                                    <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden mt-6">
                                        <div className="p-6 border-b border-slate-100 flex justify-between items-center">
                                            <h3 className="text-lg font-bold text-slate-800">Giao dịch gần đây ({dashboardFilter})</h3>
                                            <button onClick={() => setActiveTab('sales')} className="text-sm text-blue-600 font-medium hover:underline">Xem tất cả</button>
                                        </div>
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-sm text-left">
                                                <thead className="text-xs text-slate-500 uppercase bg-slate-50">
                                                    <tr>
                                                        <th className="px-6 py-4">Sản phẩm</th>
                                                        <th className="px-6 py-4">Số lượng</th>
                                                        <th className="px-6 py-4">Doanh thu</th>
                                                        <th className="px-6 py-4">Thời gian</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100">
                                                    {dashboardStats.filteredSales.slice(0, 5).map(sale => {
                                                        const t = getTemplate(sale.templateId);
                                                        return (
                                                            <tr key={sale.id} className="hover:bg-slate-50/50">
                                                                <td className="px-6 py-4 font-medium text-slate-800">{getTemplateDisplayName(t)}</td>
                                                                <td className="px-6 py-4">{sale.quantitySold}</td>
                                                                <td className="px-6 py-4 text-emerald-600 font-semibold">{formatCurrency(sale.actualSellingPrice * sale.quantitySold)}</td>
                                                                <td className="px-6 py-4 text-slate-500">{formatDate(sale.saleDate)}</td>
                                                            </tr>
                                                        )
                                                    })}
                                                    {dashboardStats.filteredSales.length === 0 && (
                                                        <tr><td colSpan="4" className="px-6 py-8 text-center text-slate-500">Không có giao dịch nào trong khoảng thời gian này.</td></tr>
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                                )}

                                {/* ================= TAB 2: TEMPLATES ================= */}
                                {activeTab === 'templates' && (
                                <div className="space-y-6">
                                    <div>
                                        <h2 className="text-2xl font-bold text-slate-900 tracking-tight">Danh mục Mẫu sản phẩm</h2>
                                        <p className="text-slate-500 mt-1">Tạo khung thông tin chuẩn trước khi nhập kho</p>
                                    </div>

                                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                        {/* Thêm Mẫu Mới */}
                                        <div className="lg:col-span-1">
                                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 sticky top-4">
                                                <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center">{Database && <Database className="mr-2 text-blue-500" size={20}/>} Thêm Mẫu Mới</h3>
                                                <form onSubmit={handleAddTemplate} className="space-y-4">
                                                    <div>
                                                        <label className="block text-sm font-medium text-slate-700 mb-1">Loại thiết bị</label>
                                                        <select className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                                                            value={templateForm.category} onChange={e => setTemplateForm({...templateForm, category: e.target.value})}>
                                                            <option value="Bàn phím">Bàn phím cơ</option>
                                                            <option value="Chuột">Chuột Gaming/VP</option>
                                                            <option value="Keycap">Bộ Keycap</option>
                                                            <option value="Khác">Phụ kiện khác</option>
                                                        </select>
                                                    </div>
                                                    
                                                    <div className="grid grid-cols-2 gap-3">
                                                        <div>
                                                            <label className="block text-sm font-medium text-slate-700 mb-1">Thương hiệu *</label>
                                                            <input required type="text" placeholder="VD: Akko" className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none"
                                                                value={templateForm.brand} onChange={e => setTemplateForm({...templateForm, brand: e.target.value})} />
                                                        </div>
                                                        <div>
                                                            <label className="block text-sm font-medium text-slate-700 mb-1">{templateForm.category === 'Keycap' ? 'Tên bộ' : 'Mã Model'} *</label>
                                                            <input required type="text" placeholder="VD: 3098N" className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none"
                                                                value={templateForm.category === 'Keycap' ? templateForm.name : templateForm.model} 
                                                                onChange={e => {
                                                                    if(templateForm.category === 'Keycap') setTemplateForm({...templateForm, name: e.target.value});
                                                                    else setTemplateForm({...templateForm, model: e.target.value});
                                                                }} />
                                                        </div>
                                                    </div>

                                                    {/* Dynamic Fields based on Category */}
                                                    {templateForm.category === 'Bàn phím' && (
                                                        <div className="grid grid-cols-2 gap-3">
                                                            <div>
                                                                <label className="block text-sm font-medium text-slate-700 mb-1">Loại Switch</label>
                                                                <input type="text" placeholder="Red, Blue..." className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none"
                                                                    value={templateForm.switchType} onChange={e => setTemplateForm({...templateForm, switchType: e.target.value})} />
                                                            </div>
                                                            <div>
                                                                <label className="block text-sm font-medium text-slate-700 mb-1">Màu sắc</label>
                                                                <input type="text" placeholder="Đen, Trắng..." className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none"
                                                                    value={templateForm.color} onChange={e => setTemplateForm({...templateForm, color: e.target.value})} />
                                                            </div>
                                                        </div>
                                                    )}
                                                    {templateForm.category === 'Chuột' && (
                                                        <div className="grid grid-cols-2 gap-3">
                                                            <div>
                                                                <label className="block text-sm font-medium text-slate-700 mb-1">Kết nối</label>
                                                                <input type="text" placeholder="Có dây, Wireless..." className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none"
                                                                    value={templateForm.connectionType} onChange={e => setTemplateForm({...templateForm, connectionType: e.target.value})} />
                                                            </div>
                                                            <div>
                                                                <label className="block text-sm font-medium text-slate-700 mb-1">Màu sắc</label>
                                                                <input type="text" placeholder="Đen, Trắng..." className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none"
                                                                    value={templateForm.color} onChange={e => setTemplateForm({...templateForm, color: e.target.value})} />
                                                            </div>
                                                        </div>
                                                    )}
                                                    {templateForm.category === 'Keycap' && (
                                                        <div>
                                                            <label className="block text-sm font-medium text-slate-700 mb-1">Profile</label>
                                                            <input type="text" placeholder="OEM, Cherry, XDA..." className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none"
                                                                value={templateForm.profile} onChange={e => setTemplateForm({...templateForm, profile: e.target.value})} />
                                                        </div>
                                                    )}

                                                    <div className="grid grid-cols-2 gap-3">
                                                        <div>
                                                            <label className="block text-sm font-medium text-slate-700 mb-1">Giá nhập (gợi ý)</label>
                                                            <input type="number" min="0" className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none"
                                                                value={templateForm.importPrice} onChange={e => setTemplateForm({...templateForm, importPrice: e.target.value})} />
                                                        </div>
                                                        <div>
                                                            <label className="block text-sm font-medium text-slate-700 mb-1">Giá bán (gợi ý)</label>
                                                            <input type="number" min="0" className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none"
                                                                value={templateForm.exportPrice} onChange={e => setTemplateForm({...templateForm, exportPrice: e.target.value})} />
                                                        </div>
                                                    </div>

                                                    <div>
                                                        <label className="block text-sm font-medium text-slate-700 mb-1">Hình ảnh (Auto resize)</label>
                                                        <div className="flex items-center space-x-3">
                                                            {templateForm.image ? (
                                                                <img src={templateForm.image} alt="Preview" className="h-12 w-12 rounded-lg object-cover border" />
                                                            ) : (
                                                                <div className="h-12 w-12 rounded-lg bg-slate-100 border border-dashed border-slate-300 flex items-center justify-center text-slate-400">{ImageIcon && <ImageIcon size={20}/>}</div>
                                                            )}
                                                            <input type="file" accept="image/*" onChange={handleImageChange} className="text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer"/>
                                                        </div>
                                                    </div>

                                                    <button type="submit" className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold transition-colors flex justify-center items-center">
                                                        {Plus && <Plus size={20} className="mr-2" />} Thêm mẫu sản phẩm
                                                    </button>
                                                </form>
                                            </div>
                                        </div>

                                        {/* Danh sách Mẫu */}
                                        <div className="lg:col-span-2 space-y-4">
                                            <div className="flex bg-white p-2 rounded-xl shadow-sm border border-slate-200 items-center">
                                                {Search && <Search className="text-slate-400 ml-3" size={20} />}
                                                <input type="text" placeholder="Tìm kiếm mẫu theo tên, thương hiệu, model..." 
                                                    className="w-full p-2 outline-none bg-transparent"
                                                    value={searchTerms.templates} onChange={e => setSearchTerms({...searchTerms, templates: e.target.value})} />
                                            </div>

                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                                {filteredTemplates.map(t => (
                                                    <div key={t.id} className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex gap-4 hover:shadow-md transition-shadow">
                                                        <div className="w-20 h-20 shrink-0 rounded-xl bg-slate-100 flex items-center justify-center overflow-hidden border border-slate-100">
                                                            {t.image ? <img src={t.image} alt={t.model} className="w-full h-full object-cover" /> : (ImageIcon ? <ImageIcon className="text-slate-300" size={32}/> : <span className="text-xs text-slate-400">No Img</span>)}
                                                        </div>
                                                        <div className="flex-1 min-w-0">
                                                            <div className="flex justify-between items-start">
                                                                <h4 className="font-bold text-slate-800 truncate">{getTemplateDisplayName(t)}</h4>
                                                                <button onClick={() => handleDeleteTemplate(t.id)} className="text-slate-400 hover:text-rose-500 p-1">{Trash2 && <Trash2 size={16}/>}</button>
                                                            </div>
                                                            <p className="text-xs text-slate-500 mt-1">{getTemplateDetails(t)}</p>
                                                            <div className="mt-2 text-sm flex gap-3 text-slate-600">
                                                                <span>Nhập: {formatCurrency(t.importPrice)}</span>
                                                                <span>Bán: <span className="font-semibold text-emerald-600">{formatCurrency(t.exportPrice)}</span></span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                ))}
                                                {filteredTemplates.length === 0 && (
                                                    <div className="col-span-full py-12 text-center text-slate-500 bg-white rounded-2xl border border-dashed border-slate-300">
                                                        Không tìm thấy mẫu sản phẩm nào.
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                )}

                                {/* ================= TAB 3: INVENTORY ================= */}
                                {activeTab === 'inventory' && (
                                <div className="space-y-6">
                                    <div>
                                        <h2 className="text-2xl font-bold text-slate-900 tracking-tight">Quản lý Kho hàng</h2>
                                        <p className="text-slate-500 mt-1">Nhập hàng và kiểm soát tồn kho thực tế</p>
                                    </div>

                                    {/* Form Nhập Kho */}
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 relative z-10">
                                        <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center">{PackagePlus && <PackagePlus className="mr-2 text-orange-500" size={20}/>} Thêm Lô Hàng Mới</h3>
                                        <form onSubmit={handleAddInventory} className="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                                            
                                            {/* Custom Dropdown for Template Selection */}
                                            <div className="md:col-span-2 relative">
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Chọn mẫu sản phẩm *</label>
                                                <div className="relative">
                                                    <div onClick={() => setIsTemplateDropdownOpen(!isTemplateDropdownOpen)} 
                                                         className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl cursor-pointer flex justify-between items-center hover:bg-slate-100">
                                                        <span className="truncate">{inventoryForm.templateId ? getTemplateDisplayName(getTemplate(inventoryForm.templateId)) : '--- Bấm để chọn ---'}</span>
                                                        {ChevronDown ? <ChevronDown size={16} className="text-slate-500"/> : <span className="text-slate-500 font-bold">▾</span>}
                                                    </div>
                                                    
                                                    {isTemplateDropdownOpen && (
                                                        <div className="absolute top-full left-0 w-full mt-1 bg-white border border-slate-200 shadow-xl rounded-xl overflow-hidden z-50">
                                                            <div className="p-2 border-b bg-slate-50 sticky top-0">
                                                                <input type="text" placeholder="Tìm kiếm mẫu..." autoFocus
                                                                    className="w-full p-2 border rounded-lg text-sm outline-none focus:border-blue-500"
                                                                    value={templateSearchText} onChange={(e) => setTemplateSearchText(e.target.value)} />
                                                            </div>
                                                            <div className="max-h-60 overflow-y-auto">
                                                                {dropdownFilteredTemplates.map(t => (
                                                                    <div key={t.id} className="p-3 border-b hover:bg-blue-50 cursor-pointer text-sm flex items-center gap-3"
                                                                        onClick={() => {
                                                                            setInventoryForm(prev => ({...prev, templateId: t.id, costPrice: t.importPrice, sellingPrice: t.exportPrice}));
                                                                            setIsTemplateDropdownOpen(false);
                                                                            setTemplateSearchText('');
                                                                        }}>
                                                                        <div className="w-8 h-8 rounded bg-slate-100 shrink-0 overflow-hidden">{t.image && <img src={t.image} className="w-full h-full object-cover"/>}</div>
                                                                        <div>
                                                                            <p className="font-medium text-slate-800">{getTemplateDisplayName(t)}</p>
                                                                            <p className="text-xs text-slate-500">Gợi ý nhập: {formatCurrency(t.importPrice)}</p>
                                                                        </div>
                                                                    </div>
                                                                ))}
                                                                {dropdownFilteredTemplates.length === 0 && <div className="p-4 text-center text-sm text-slate-500">Không tìm thấy</div>}
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>

                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Số lượng *</label>
                                                <input required type="number" min="1" className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500"
                                                    value={inventoryForm.quantity} onChange={e => setInventoryForm({...inventoryForm, quantity: e.target.value})} />
                                            </div>

                                            <button type="submit" className="w-full py-2.5 bg-orange-500 hover:bg-orange-600 text-white rounded-xl font-bold transition-colors">
                                                Nhập Kho
                                            </button>

                                            <div className="md:col-span-1">
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Giá Vốn (Thực tế)</label>
                                                <input type="number" min="0" className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none"
                                                    value={inventoryForm.costPrice} onChange={e => setInventoryForm({...inventoryForm, costPrice: e.target.value})} />
                                            </div>
                                            <div className="md:col-span-1">
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Giá Bán (Thực tế)</label>
                                                <input type="number" min="0" className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none"
                                                    value={inventoryForm.sellingPrice} onChange={e => setInventoryForm({...inventoryForm, sellingPrice: e.target.value})} />
                                            </div>
                                            <div className="md:col-span-1">
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Thanh toán nhà CC</label>
                                                <select className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none"
                                                    value={inventoryForm.payment} onChange={e => setInventoryForm({...inventoryForm, payment: e.target.value})}>
                                                    <option>Thanh toán online</option>
                                                    <option>Tiền mặt</option>
                                                    <option>Công nợ</option>
                                                </select>
                                            </div>
                                            <div className="md:col-span-1">
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Trạng thái</label>
                                                <select className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none"
                                                    value={inventoryForm.status} onChange={e => setInventoryForm({...inventoryForm, status: e.target.value})}>
                                                    <option>Đã về kho</option>
                                                    <option>Đang vận chuyển</option>
                                                    <option>Order trước</option>
                                                </select>
                                            </div>
                                        </form>
                                    </div>

                                    {/* Bảng Tồn Kho */}
                                    
                                    {/* Phân loại danh mục */}
                                    <div className="flex flex-wrap gap-2 mb-2 relative z-0">
                                        {['All', 'Bàn phím', 'Chuột', 'Keycap', 'Khác'].map(cat => (
                                            <button key={cat} 
                                                onClick={() => setInventoryCategoryFilter(cat)}
                                                className={`px-4 py-2 rounded-xl text-sm font-semibold transition-colors ${inventoryCategoryFilter === cat ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}`}>
                                                {cat === 'All' ? 'Tất cả danh mục' : cat}
                                            </button>
                                        ))}
                                    </div>

                                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden relative z-0">
                                        <div className="p-4 border-b flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-slate-50/50">
                                            
                                            {/* Bộ lọc Còn hàng / Hết hàng */}
                                            <div className="flex bg-white p-1 rounded-lg border shadow-sm w-full md:w-auto overflow-x-auto">
                                                <button onClick={() => setInventoryStockFilter('in_stock')} className={`flex-1 md:flex-none px-4 py-1.5 text-sm font-bold rounded-md transition-colors whitespace-nowrap ${inventoryStockFilter === 'in_stock' ? 'bg-emerald-100 text-emerald-700 shadow-sm' : 'text-slate-500 hover:bg-slate-50'}`}>Còn hàng</button>
                                                <button onClick={() => setInventoryStockFilter('out_of_stock')} className={`flex-1 md:flex-none px-4 py-1.5 text-sm font-bold rounded-md transition-colors whitespace-nowrap ${inventoryStockFilter === 'out_of_stock' ? 'bg-rose-100 text-rose-700 shadow-sm' : 'text-slate-500 hover:bg-slate-50'}`}>Đã bán hết</button>
                                                <button onClick={() => setInventoryStockFilter('all')} className={`flex-1 md:flex-none px-4 py-1.5 text-sm font-bold rounded-md transition-colors whitespace-nowrap ${inventoryStockFilter === 'all' ? 'bg-slate-800 text-white shadow-sm' : 'text-slate-500 hover:bg-slate-50'}`}>Tất cả</button>
                                            </div>

                                            <div className="flex bg-white p-2 rounded-lg border w-full md:max-w-xs lg:max-w-md items-center shadow-sm">
                                                {Search && <Search className="text-slate-400 ml-2" size={18} />}
                                                <input type="text" placeholder="Tìm kiếm trong kho..." className="w-full p-1 ml-2 outline-none text-sm"
                                                    value={searchTerms.inventory} onChange={e => setSearchTerms({...searchTerms, inventory: e.target.value})} />
                                            </div>
                                        </div>
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-sm text-left">
                                                <thead className="text-xs text-slate-500 uppercase bg-slate-100">
                                                    <tr>
                                                        <th className="px-4 py-3">Sản phẩm</th>
                                                        <th className="px-4 py-3">Phân loại</th>
                                                        <th className="px-4 py-3 text-center">Tồn kho</th>
                                                        <th className="px-4 py-3">Giá Vốn</th>
                                                        <th className="px-4 py-3">Giá Bán</th>
                                                        <th className="px-4 py-3">Trạng thái</th>
                                                        <th className="px-4 py-3 text-right">Thao tác</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100">
                                                    {filteredInventory.map(inv => {
                                                        const t = getTemplate(inv.templateId);
                                                        return (
                                                            <tr key={inv.id} className="hover:bg-slate-50">
                                                                <td className="px-4 py-3 flex items-center gap-3">
                                                                    <div className="w-10 h-10 rounded border overflow-hidden bg-white shrink-0 flex items-center justify-center">
                                                                        {t?.image ? <img src={t.image} className="w-full h-full object-cover"/> : (ImageIcon ? <ImageIcon className="w-full h-full p-2 text-slate-300"/> : <span className="text-xs text-slate-400">Ảnh</span>)}
                                                                    </div>
                                                                    <span className="font-medium text-slate-800">{getTemplateDisplayName(t)}</span>
                                                                </td>
                                                                <td className="px-4 py-3 text-slate-500">{getTemplateDetails(t)}</td>
                                                                <td className="px-4 py-3 text-center">
                                                                    <span className={`px-2.5 py-1 rounded-full text-xs font-bold ${inv.quantity > 0 ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}`}>
                                                                        {inv.quantity}
                                                                    </span>
                                                                </td>
                                                                <td className="px-4 py-3">{formatCurrency(inv.costPrice)}</td>
                                                                <td className="px-4 py-3 font-medium text-blue-600">{formatCurrency(inv.sellingPrice)}</td>
                                                                <td className="px-4 py-3 text-xs text-slate-500">{inv.status}</td>
                                                                <td className="px-4 py-3 text-right space-x-2">
                                                                    <button onClick={() => openSellModal(inv)} disabled={inv.quantity <= 0} className="p-1.5 text-white bg-emerald-500 rounded hover:bg-emerald-600 disabled:opacity-50 disabled:cursor-not-allowed" title="Bán hàng">
                                                                        {ShoppingCart ? <ShoppingCart size={16}/> : <span>Bán</span>}
                                                                    </button>
                                                                    <button onClick={() => openEditInvModal(inv)} className="p-1.5 text-blue-600 bg-blue-50 rounded hover:bg-blue-100" title="Sửa thông tin">
                                                                        {Edit ? <Edit size={16}/> : <span>Sửa</span>}
                                                                    </button>
                                                                    <button onClick={() => handleDeleteInventory(inv.id)} className="p-1.5 text-rose-600 bg-rose-50 rounded hover:bg-rose-100" title="Xóa">
                                                                        {Trash2 ? <Trash2 size={16}/> : <span>Xóa</span>}
                                                                    </button>
                                                                </td>
                                                            </tr>
                                                        )
                                                    })}
                                                    {filteredInventory.length === 0 && <tr><td colSpan="7" className="py-8 text-center text-slate-500">Kho hàng trống.</td></tr>}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                                )}

                                {/* ================= TAB 4: SALES HISTORY ================= */}
                                {activeTab === 'sales' && (
                                <div className="space-y-6">
                                    <div>
                                        <h2 className="text-2xl font-bold text-slate-900 tracking-tight">Lịch sử Đơn hàng</h2>
                                        <p className="text-slate-500 mt-1">Quản lý các giao dịch đã thực hiện</p>
                                    </div>

                                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-sm text-left">
                                                <thead className="text-xs text-slate-500 uppercase bg-slate-100">
                                                    <tr>
                                                        <th className="px-6 py-4">Mã Đơn</th>
                                                        <th className="px-6 py-4">Sản phẩm</th>
                                                        <th className="px-6 py-4 text-center">Số lượng</th>
                                                        <th className="px-6 py-4">Giá bán/SP</th>
                                                        <th className="px-6 py-4">Tổng thu</th>
                                                        <th className="px-6 py-4">Vận chuyển</th>
                                                        <th className="px-6 py-4">Ngày giờ</th>
                                                        <th className="px-6 py-4 text-right">Xóa</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100">
                                                    {sales.map(sale => {
                                                        const t = getTemplate(sale.templateId);
                                                        return (
                                                            <tr key={sale.id} className="hover:bg-slate-50">
                                                                <td className="px-6 py-4 text-xs font-mono text-slate-400">{(sale.id || '').replace('tx_','').slice(-6)}</td>
                                                                <td className="px-6 py-4 font-medium text-slate-800">{getTemplateDisplayName(t)}</td>
                                                                <td className="px-6 py-4 text-center font-bold text-slate-700">{sale.quantitySold}</td>
                                                                <td className="px-6 py-4 text-slate-600">{formatCurrency(sale.actualSellingPrice)}</td>
                                                                <td className="px-6 py-4 font-bold text-emerald-600">{formatCurrency(sale.actualSellingPrice * sale.quantitySold)}</td>
                                                                <td className="px-6 py-4 text-xs text-slate-500">{sale.deliveryType}</td>
                                                                <td className="px-6 py-4 text-slate-500">{formatDate(sale.saleDate)}</td>
                                                                <td className="px-6 py-4 text-right">
                                                                    <button onClick={() => handleDeleteSale(sale.id)} className="text-slate-400 hover:text-rose-600">{Trash2 && <Trash2 size={18}/>}</button>
                                                                </td>
                                                            </tr>
                                                        )
                                                    })}
                                                    {sales.length === 0 && <tr><td colSpan="8" className="py-12 text-center text-slate-500">Chưa có giao dịch nào.</td></tr>}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                                )}

                                {/* ================= TAB 5: SYNC ================= */}
                                {activeTab === 'sync' && (
                                <div className="space-y-6 max-w-3xl">
                                    <div>
                                        <h2 className="text-2xl font-bold text-slate-900 tracking-tight">Đồng bộ Đám mây</h2>
                                        <p className="text-slate-500 mt-1">Lưu trữ dữ liệu an toàn qua Google Drive / Apps Script</p>
                                    </div>

                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                        <h3 className="font-bold text-slate-800 mb-4 flex items-center">{CloudLightning && <CloudLightning className="mr-2 text-blue-500"/>} Cấu hình API</h3>
                                        <div className="flex gap-2">
                                            <input type="text" placeholder="Dán link Google Apps Script Web App URL vào đây..." 
                                                className="flex-1 p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500"
                                                value={syncUrl} onChange={e => setSyncUrl(e.target.value)} />
                                            <button onClick={handleSaveSyncUrl} className="px-6 py-3 bg-slate-800 hover:bg-slate-900 text-white rounded-xl font-medium transition-colors">
                                                Lưu URL
                                            </button>
                                        </div>
                                        {syncStatus.message && <p className={`mt-3 text-sm font-medium ${syncStatus.type}`}>{syncStatus.message}</p>}
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <button onClick={syncToCloud} className="p-6 bg-white border border-slate-200 rounded-2xl hover:border-blue-300 hover:shadow-md transition-all text-left group">
                                            {UploadCloud && <UploadCloud className="text-blue-500 mb-3 group-hover:scale-110 transition-transform" size={32}/>}
                                            <h4 className="font-bold text-slate-800 text-lg">Đẩy lên Cloud (Push)</h4>
                                            <p className="text-sm text-slate-500 mt-1">Lưu bản sao dữ liệu hiện tại lên Google Drive.</p>
                                        </button>
                                        <button onClick={syncFromCloud} className="p-6 bg-white border border-slate-200 rounded-2xl hover:border-emerald-300 hover:shadow-md transition-all text-left group">
                                            {DownloadCloud && <DownloadCloud className="text-emerald-500 mb-3 group-hover:scale-110 transition-transform" size={32}/>}
                                            <h4 className="font-bold text-slate-800 text-lg">Tải về máy (Pull)</h4>
                                            <p className="text-sm text-slate-500 mt-1">Ghi đè dữ liệu trên máy bằng bản sao trên Cloud.</p>
                                        </button>
                                    </div>

                                    <div className="bg-orange-50 border border-orange-200 p-6 rounded-2xl">
                                        <h3 className="font-bold text-orange-800 mb-2 flex items-center">{Save && <Save className="mr-2"/>} Sao lưu thủ công</h3>
                                        <p className="text-sm text-orange-700 mb-4">Bạn nên thường xuyên tải file dữ liệu về máy để đề phòng rủi ro.</p>
                                        <button onClick={exportBackupData} className="px-4 py-2 bg-orange-600 hover:bg-orange-700 text-white rounded-lg text-sm font-medium transition-colors">
                                            Tải file Backup (.json)
                                        </button>
                                    </div>
                                </div>
                                )}

                            </div>
                        </div>
                    </div>

                    {/* ================= MODALS NỔI ================= */}
                    
                    {/* SELL MODAL */}
                    {sellModal.isOpen && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-[100] p-4 animate-fade-in">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden" onClick={e => e.stopPropagation()}>
                                <div className="p-4 border-b flex justify-between items-center bg-slate-50">
                                    <h3 className="font-bold text-lg text-slate-800">Chốt Đơn Bán Hàng</h3>
                                    <button onClick={() => setSellModal({isOpen: false, item: null, qty: 1})} className="text-slate-400 hover:text-slate-700">{X && <X size={20}/>}</button>
                                </div>
                                <div className="p-6 space-y-4">
                                    <div className="bg-blue-50 p-3 rounded-xl border border-blue-100">
                                        <p className="font-medium text-blue-900">{getTemplateDisplayName(getTemplate(sellModal.item?.templateId))}</p>
                                        <p className="text-sm text-blue-700 mt-1">Kho còn: <span className="font-bold">{sellModal.item?.quantity}</span> chiếc</p>
                                    </div>
                                    
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Số lượng bán</label>
                                            <input type="number" min="1" max={sellModal.item?.quantity} 
                                                className="w-full p-2.5 border rounded-xl outline-none focus:border-blue-500"
                                                value={sellModal.qty} onChange={e => setSellModal({...sellModal, qty: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Giá chốt/SP</label>
                                            <input type="number" min="0" 
                                                className="w-full p-2.5 border rounded-xl outline-none focus:border-blue-500"
                                                value={sellModal.price} onChange={e => setSellModal({...sellModal, price: e.target.value})} />
                                        </div>
                                    </div>
                                    
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1">Hình thức giao hàng/Thanh toán</label>
                                        <select className="w-full p-2.5 border rounded-xl outline-none focus:border-blue-500"
                                            value={sellModal.type} onChange={e => setSellModal({...sellModal, type: e.target.value})}>
                                            <option>Ship COD</option>
                                            <option>Chuyển khoản trước</option>
                                            <option>Bán trực tiếp tại Shop</option>
                                            <option>Giao Hỏa Tốc</option>
                                        </select>
                                    </div>

                                    <div className="pt-2 flex justify-between items-center text-lg">
                                        <span className="text-slate-500">Tổng thu:</span>
                                        <span className="font-black text-emerald-600">{formatCurrency(sellModal.qty * sellModal.price)}</span>
                                    </div>
                                </div>
                                <div className="p-4 border-t bg-slate-50 flex gap-3 justify-end">
                                    <button onClick={() => setSellModal({isOpen: false})} className="px-4 py-2 text-slate-600 font-medium hover:bg-slate-200 rounded-lg">Hủy</button>
                                    <button onClick={handleSell} className="px-6 py-2 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-lg flex items-center shadow-lg shadow-emerald-500/30">
                                        {CheckCircle2 && <CheckCircle2 size={18} className="mr-2"/>} Xác nhận Bán
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* EDIT INVENTORY MODAL */}
                    {editInvModal.isOpen && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-[100] p-4 animate-fade-in">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden max-h-[90vh] flex flex-col" onClick={e => e.stopPropagation()}>
                                <div className="p-4 border-b flex justify-between items-center bg-slate-50 shrink-0">
                                    <h3 className="font-bold text-lg text-slate-800">Chỉnh sửa thông tin lô hàng</h3>
                                    <button onClick={() => setEditInvModal({isOpen: false, form:{}})} className="text-slate-400 hover:text-slate-700">{X && <X size={20}/>}</button>
                                </div>
                                <div className="p-6 overflow-y-auto space-y-6">
                                    
                                    <div className="flex gap-4 items-start">
                                        <div className="w-24 h-24 rounded-xl border bg-slate-50 shrink-0 relative overflow-hidden group flex items-center justify-center">
                                            {editInvModal.form.image ? <img src={editInvModal.form.image} className="w-full h-full object-cover"/> : (ImageIcon ? <ImageIcon className="w-full h-full p-6 text-slate-300"/> : <span className="text-xs text-slate-400">Ảnh</span>)}
                                            <div className="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity">
                                                <label className="cursor-pointer text-white text-xs font-medium bg-blue-600 px-2 py-1 rounded">
                                                    Đổi ảnh
                                                    <input type="file" className="hidden" accept="image/*" onChange={handleEditModalImageChange}/>
                                                </label>
                                            </div>
                                        </div>
                                        <div className="flex-1 space-y-3">
                                            {editInvModal.template?.category === 'Keycap' ? (
                                                <div>
                                                    <label className="block text-xs font-medium text-slate-500 mb-1">Tên bộ Keycap</label>
                                                    <input type="text" className="w-full p-2 border rounded-lg text-sm" value={editInvModal.form.name} onChange={e => setEditInvModal(p => ({...p, form:{...p.form, name: e.target.value}}))} />
                                                </div>
                                            ) : (
                                                <div>
                                                    <label className="block text-xs font-medium text-slate-500 mb-1">Mã Model</label>
                                                    <input type="text" className="w-full p-2 border rounded-lg text-sm" value={editInvModal.form.model} onChange={e => setEditInvModal(p => ({...p, form:{...p.form, model: e.target.value}}))} />
                                                </div>
                                            )}
                                            <p className="text-xs text-orange-600 bg-orange-50 p-2 rounded border border-orange-100">Lưu ý: Đổi Ảnh/Tên ở đây sẽ áp dụng cho toàn bộ các lô hàng dùng chung Mẫu này.</p>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 md:grid-cols-3 gap-4 border-t pt-4">
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Số lượng tồn</label>
                                            <input type="number" min="0" className="w-full p-2.5 border rounded-xl" value={editInvModal.form.quantity} onChange={e => setEditInvModal(p => ({...p, form:{...p.form, quantity: e.target.value}}))} />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Giá Vốn</label>
                                            <input type="number" min="0" className="w-full p-2.5 border rounded-xl" value={editInvModal.form.costPrice} onChange={e => setEditInvModal(p => ({...p, form:{...p.form, costPrice: e.target.value}}))} />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Giá Bán</label>
                                            <input type="number" min="0" className="w-full p-2.5 border rounded-xl" value={editInvModal.form.sellingPrice} onChange={e => setEditInvModal(p => ({...p, form:{...p.form, sellingPrice: e.target.value}}))} />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Trạng thái</label>
                                            <select className="w-full p-2.5 border rounded-xl" value={editInvModal.form.status} onChange={e => setEditInvModal(p => ({...p, form:{...p.form, status: e.target.value}}))}>
                                                <option>Đã về kho</option><option>Đang vận chuyển</option><option>Order trước</option>
                                            </select>
                                        </div>
                                        <div className="md:col-span-2">
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Thanh toán với NCC</label>
                                            <select className="w-full p-2.5 border rounded-xl" value={editInvModal.form.payment} onChange={e => setEditInvModal(p => ({...p, form:{...p.form, payment: e.target.value}}))}>
                                                <option>Thanh toán online</option><option>Tiền mặt</option><option>Công nợ</option><option>Hoàn trả</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div className="p-4 border-t bg-slate-50 flex gap-3 justify-end shrink-0">
                                    <button onClick={() => setEditInvModal({isOpen: false, form:{}})} className="px-4 py-2 text-slate-600 font-medium hover:bg-slate-200 rounded-lg">Hủy</button>
                                    <button onClick={handleEditInventorySubmit} className="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg flex items-center">
                                        Lưu thay đổi
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
