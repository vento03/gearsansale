<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GearShop Manager - Săn Sale Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c7d2fe; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #818cf8; }
        
        .sold-out { opacity: 0.6; grayscale: 0.5; }
        .collapse-content { transition: max-height 0.3s ease-out; overflow: hidden; }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-900 flex h-screen overflow-hidden">

    <!-- Sidebar PC -->
    <div class="w-64 bg-white border-r border-gray-200 flex flex-col hidden md:flex shrink-0 shadow-sm z-10">
        <div class="p-6 border-b border-gray-100 flex items-center space-x-3">
            <div class="bg-indigo-600 p-2 rounded-lg text-white shadow-md shadow-indigo-200">
                <i data-lucide="shopping-bag"></i>
            </div>
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-violet-600">GearSănSale</h1>
        </div>
        <nav class="flex-1 p-4 space-y-1.5 overflow-y-auto">
            <button onclick="switchTab('dashboard')" id="tab-dashboard" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-colors bg-indigo-50 text-indigo-700 font-medium">
                <i data-lucide="layout-dashboard"></i> <span>Tổng quan</span>
            </button>
            <button onclick="switchTab('products')" id="tab-products" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-colors text-gray-600 hover:bg-gray-100">
                <i data-lucide="package-search"></i> <span>Kho Hàng</span>
            </button>
            <button onclick="switchTab('templates')" id="tab-templates" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-colors text-gray-600 hover:bg-gray-100">
                <i data-lucide="copy-plus"></i> <span>Kho Mẫu (Templates)</span>
            </button>
            <button onclick="switchTab('transactions')" id="tab-transactions" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-colors text-gray-600 hover:bg-gray-100">
                <i data-lucide="history"></i> <span>Lịch sử GD</span>
            </button>
            <div class="pt-4 pb-2"><div class="h-px bg-gray-100 w-full"></div></div>
            <button onclick="switchTab('sync')" id="tab-sync" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-colors text-gray-600 hover:bg-gray-100">
                <i data-lucide="cloud-sync"></i> <span>Đồng bộ & Backup</span>
            </button>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden relative">
        <!-- Header Mobile -->
        <div class="md:hidden bg-white p-4 border-b flex justify-between items-center shrink-0 z-10 shadow-sm">
            <h1 class="text-lg font-bold text-indigo-600 flex items-center"><i data-lucide="shopping-bag" class="w-5 h-5 mr-2"></i> GearSănSale</h1>
            <div class="flex space-x-1">
                <button onclick="switchTab('dashboard')" class="p-2 rounded bg-indigo-100 text-indigo-600"><i data-lucide="layout-dashboard" class="w-5 h-5"></i></button>
                <button onclick="switchTab('products')" class="p-2 rounded text-gray-500 hover:bg-gray-100"><i data-lucide="package-search" class="w-5 h-5"></i></button>
                <button onclick="switchTab('templates')" class="p-2 rounded text-gray-500 hover:bg-gray-100"><i data-lucide="copy-plus" class="w-5 h-5"></i></button>
                <button onclick="switchTab('transactions')" class="p-2 rounded text-gray-500 hover:bg-gray-100"><i data-lucide="history" class="w-5 h-5"></i></button>
            </div>
        </div>

        <main id="main-content" class="flex-1 overflow-x-hidden overflow-y-auto bg-[#f8fafc] p-4 md:p-8">
            <!-- Render Content Here -->
        </main>
    </div>

    <!-- === MODAL: THÊM / SỬA SẢN PHẨM & MẪU === -->
    <div id="product-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden fade-in my-8 border border-slate-100">
            <div class="flex justify-between items-center p-5 border-b border-gray-100 bg-slate-50/50">
                <h3 id="product-modal-title" class="text-lg font-bold text-slate-800">Thêm sản phẩm mới</h3>
                <button type="button" onclick="closeModal('product-modal')" class="text-slate-400 hover:text-rose-500 transition-colors"><i data-lucide="x"></i></button>
            </div>
            
            <form id="product-form" onsubmit="handleSaveProduct(event)" class="p-6 space-y-5">
                <input type="hidden" id="p-id">
                <input type="hidden" id="is-template-mode" value="false">
                
                <!-- Khu vực chọn mẫu (Chỉ hiện khi thêm mới SP) -->
                <div id="template-selector-box" class="bg-indigo-50/50 p-4 rounded-xl border border-indigo-100 mb-2">
                    <label class="block text-xs font-bold uppercase text-indigo-800 mb-1 flex items-center"><i data-lucide="wand-2" class="w-3 h-3 mr-1"></i> Nhập nhanh từ Kho Mẫu</label>
                    <select id="p-template-select" onchange="applyTemplate(this.value)" class="w-full px-3 py-2 text-sm border border-indigo-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white text-indigo-900 font-medium">
                        <option value="">-- Tự nhập tay hoặc chọn mẫu có sẵn --</option>
                    </select>
                </div>

                <!-- Ảnh -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Ảnh minh họa</label>
                    <div class="flex items-center space-x-4">
                        <div id="p-image-preview" class="w-16 h-16 bg-slate-100 rounded-xl flex items-center justify-center overflow-hidden border border-slate-200 shrink-0 shadow-sm">
                            <i data-lucide="image" class="text-slate-400"></i>
                        </div>
                        <div class="flex-1">
                            <input type="file" id="p-image-upload" accept="image/*" onchange="previewImage(event)" class="w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-600 hover:file:bg-indigo-100 cursor-pointer transition-colors" />
                        </div>
                        <input type="hidden" id="p-image-base64">
                    </div>
                </div>

                <!-- Danh mục & Tồn kho -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Danh mục *</label>
                        <select id="p-category" onchange="toggleCategoryFields()" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                            <option value="Bàn phím">Bàn phím cơ</option>
                            <option value="Chuột">Chuột</option>
                            <option value="Tai nghe">Tai nghe</option>
                            <option value="Lót chuột">Lót chuột</option>
                            <option value="Keycaps">Keycaps</option>
                            <option value="Dây cáp">Dây cáp custom</option>
                            <option value="Phụ kiện">Phụ kiện khác</option>
                        </select>
                    </div>
                    <div id="p-stock-container">
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Số lượng nhập *</label>
                        <input type="number" min="0" id="p-stock" value="1" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none font-bold text-indigo-700" />
                    </div>
                </div>

                <!-- Hãng & Model -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Hãng *</label>
                        <input required type="text" id="p-brand" placeholder="Vd: Aula..." class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Model *</label>
                        <input required type="text" id="p-model" placeholder="Vd: F75..." class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" />
                    </div>
                </div>
                
                <!-- Màu sắc -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Màu sắc / Phiên bản *</label>
                    <input required type="text" id="p-color" placeholder="Vd: Trắng Xanh..." class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" />
                </div>

                <!-- Fields riêng Bàn phím -->
                <div id="keyboard-fields" class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Switch (Trục)</label>
                        <input type="text" id="p-switch" placeholder="Vd: Reaper..." class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Tấm Plate</label>
                        <select id="p-plate" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                            <option value="PC">PC (Polycarbonate)</option>
                            <option value="FR4">FR4</option>
                            <option value="Thép">Thép (Steel)</option>
                            <option value="Nhôm">Nhôm (Aluminum)</option>
                            <option value="POM">POM</option>
                            <option value="Khác">Khác</option>
                        </select>
                    </div>
                </div>

                <!-- Giá cả -->
                <div class="grid grid-cols-2 gap-4 pt-3 border-t border-slate-100">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Giá săn sale (VNĐ)</label>
                        <input required type="number" min="0" id="p-import" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-emerald-700 font-medium" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Giá bán dự kiến (VNĐ)</label>
                        <input required type="number" min="0" id="p-export" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-rose-500 outline-none text-rose-700 font-medium" />
                    </div>
                </div>

                <!-- Lưu làm mẫu -->
                <div id="save-template-box" class="flex items-center space-x-2 pt-2">
                    <input type="checkbox" id="p-save-as-template" class="w-4 h-4 text-indigo-600 rounded border-gray-300 focus:ring-indigo-500">
                    <label for="p-save-as-template" class="text-sm font-medium text-slate-600 cursor-pointer">Lưu cấu hình này vào <span class="text-indigo-600 font-bold">Kho Mẫu</span> để dùng sau</label>
                </div>

                <div class="pt-4 flex justify-end space-x-3">
                    <button type="button" onclick="closeModal('product-modal')" class="px-5 py-2.5 text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl font-bold transition-colors">Hủy</button>
                    <button type="submit" class="px-6 py-2.5 text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl font-bold shadow-md shadow-indigo-200 transition-all transform hover:-translate-y-0.5">Lưu Lại</button>
                </div>
            </form>
        </div>
    </div>

    <!-- === MODAL: NHẬP / BÁN HÀNG === -->
    <div id="transaction-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden fade-in border border-slate-100">
            <div id="tx-header" class="flex justify-between items-center p-5 border-b border-gray-100">
                <h3 id="tx-modal-title" class="text-lg font-bold">Giao dịch</h3>
                <button type="button" onclick="closeModal('transaction-modal')" class="text-slate-400 hover:text-rose-500 transition-colors"><i data-lucide="x"></i></button>
            </div>
            <form id="transaction-form" onsubmit="handleSaveTransaction(event)" class="p-6 space-y-5">
                <input type="hidden" id="tx-type">
                <input type="hidden" id="tx-product-id">
                
                <div id="tx-error-box" class="hidden p-3 bg-rose-50 border border-rose-100 text-rose-600 text-sm rounded-xl font-medium"></div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Sản phẩm</label>
                    <textarea id="tx-product-name" disabled rows="2" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl bg-slate-50 text-slate-600 outline-none resize-none font-medium"></textarea>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Số lượng</label>
                        <input required type="number" min="1" id="tx-quantity" value="1" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none font-bold text-center" />
                        <p id="tx-stock-hint" class="text-[11px] text-slate-500 mt-1.5 hidden font-medium"></p>
                    </div>
                    <div>
                        <label id="tx-price-label" class="block text-sm font-semibold text-slate-700 mb-1">Đơn giá</label>
                        <input required type="number" min="0" id="tx-price" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none font-bold" />
                    </div>
                </div>

                <div class="pt-4 flex justify-end space-x-3 border-t border-slate-100">
                    <button type="button" onclick="closeModal('transaction-modal')" class="px-5 py-2.5 text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl font-bold transition-colors">Hủy</button>
                    <button type="submit" id="tx-submit-btn" class="px-6 py-2.5 text-white rounded-xl font-bold shadow-md transition-all transform hover:-translate-y-0.5">Xác nhận</button>
                </div>
            </form>
        </div>
    </div>

    <!-- === JAVASCRIPT LOGIC === -->
    <script>
        // --- 1. DỮ LIỆU APP ---
        let products = JSON.parse(localStorage.getItem('gearShop_products')) || [];
        let transactions = JSON.parse(localStorage.getItem('gearShop_transactions')) || [];
        let templates = JSON.parse(localStorage.getItem('gearShop_templates')) || [];
        let activeTab = 'dashboard';

        // --- 2. HÀM HỖ TRỢ ---
        function saveDataLocally() {
            localStorage.setItem('gearShop_products', JSON.stringify(products));
            localStorage.setItem('gearShop_transactions', JSON.stringify(transactions));
            localStorage.setItem('gearShop_templates', JSON.stringify(templates));
        }

        const formatCurrency = (amount) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);
        const formatDate = (dateStr) => {
            const d = new Date(dateStr);
            return `${d.toLocaleDateString('vi-VN')} ${d.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'})}`;
        };
        const getFullProductName = (p) => {
            if(!p) return 'Sản phẩm/Mẫu đã xóa';
            let name = `[${p.category || 'Bàn phím'}] ${p.brand} ${p.model} - Màu ${p.color}`;
            if(p.category === 'Bàn phím' && p.switchType) name += ` (${p.switchType})`;
            return name;
        }

        function initIcons() {
            lucide.createIcons();
        }

        // --- 3. ĐIỀU HƯỚNG TABS ---
        function switchTab(tab) {
            activeTab = tab;
            ['dashboard', 'products', 'templates', 'transactions', 'sync'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if(btn) {
                    btn.className = (t === tab) 
                        ? "w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-colors bg-indigo-100/50 text-indigo-700 font-bold shadow-sm"
                        : "w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-colors text-slate-500 hover:bg-slate-100 hover:text-slate-800 font-medium";
                }
            });
            render();
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 300;
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        const base64Image = canvas.toDataURL("image/jpeg", 0.7);
                        document.getElementById('p-image-base64').value = base64Image;
                        document.getElementById('p-image-preview').innerHTML = `<img src="${base64Image}" class="w-full h-full object-cover" />`;
                    }
                    img.src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        function toggleProfitDetails() {
            const el = document.getElementById('profit-details-container');
            const icon = document.getElementById('profit-toggle-icon');
            if(el.classList.contains('hidden')) {
                el.classList.remove('hidden');
                icon.style.transform = 'rotate(180deg)';
            } else {
                el.classList.add('hidden');
                icon.style.transform = 'rotate(0deg)';
            }
        }

        // --- 4. RENDER GIAO DIỆN ---
        function render() {
            const content = document.getElementById('main-content');
            if(activeTab === 'dashboard') content.innerHTML = getDashboardHTML();
            else if(activeTab === 'products') content.innerHTML = getProductsHTML();
            else if(activeTab === 'templates') content.innerHTML = getTemplatesHTML();
            else if(activeTab === 'transactions') content.innerHTML = getTransactionsHTML();
            else if(activeTab === 'sync') content.innerHTML = getSyncHTML();
            initIcons();
        }

        function getDashboardHTML() {
            const now = new Date();
            const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
            const day = now.getDay();
            const diff = now.getDate() - day + (day === 0 ? -6 : 1);
            const startOfWeek = new Date(now.setDate(diff)).setHours(0,0,0,0);
            const today = new Date();
            const startOfMonth = new Date(today.getFullYear(), today.getMonth(), 1).getTime();
            const startOfYear = new Date(today.getFullYear(), 0, 1).getTime();

            const totalProducts = products.length;
            const totalStock = products.reduce((sum, p) => sum + p.stock, 0);
            
            // Tính Vốn và Lãi dự kiến từ kho
            const capitalInStock = products.reduce((sum, p) => sum + (p.importPrice * p.stock), 0);
            const potentialProfit = products.reduce((sum, p) => sum + ((p.exportPrice - p.importPrice) * p.stock), 0);

            const totalRevenue = transactions.filter(t => t.type === 'EXPORT').reduce((sum, t) => sum + (t.price * t.quantity), 0);
            const totalProfit = transactions.filter(t => t.type === 'EXPORT').reduce((sum, t) => sum + (t.profit || 0), 0);

            const profitToday = transactions.filter(t => t.type === 'EXPORT' && new Date(t.timestamp).getTime() >= startOfDay).reduce((sum, t) => sum + (t.profit || 0), 0);
            const profitThisWeek = transactions.filter(t => t.type === 'EXPORT' && new Date(t.timestamp).getTime() >= startOfWeek).reduce((sum, t) => sum + (t.profit || 0), 0);
            const profitThisMonth = transactions.filter(t => t.type === 'EXPORT' && new Date(t.timestamp).getTime() >= startOfMonth).reduce((sum, t) => sum + (t.profit || 0), 0);
            const profitThisYear = transactions.filter(t => t.type === 'EXPORT' && new Date(t.timestamp).getTime() >= startOfYear).reduce((sum, t) => sum + (t.profit || 0), 0);

            let recentTxHTML = transactions.slice(0, 5).map(tx => {
                const p = products.find(p => p.id === tx.productId);
                const isImport = tx.type === 'IMPORT';
                return `
                    <div class="flex items-center justify-between p-3.5 hover:bg-slate-50 rounded-xl transition-colors border border-transparent hover:border-slate-100">
                        <div class="flex items-center space-x-3">
                            <div class="${isImport ? 'bg-indigo-100 text-indigo-600' : 'bg-emerald-100 text-emerald-600'} p-2 rounded-lg">
                                <i data-lucide="${isImport ? 'arrow-downToLine' : 'arrow-upToLine'}" class="w-4 h-4"></i>
                            </div>
                            <div>
                                <p class="font-bold text-slate-800 text-sm truncate max-w-[200px] sm:max-w-md">${getFullProductName(p)}</p>
                                <p class="text-xs text-slate-400 font-medium">${formatDate(tx.timestamp)}</p>
                            </div>
                        </div>
                        <div class="text-right shrink-0 ml-4">
                            <p class="font-bold ${isImport ? 'text-indigo-600' : 'text-emerald-600'} text-base">${isImport ? '+' : '-'}${tx.quantity}</p>
                            <p class="text-xs text-slate-500 font-medium">${formatCurrency(tx.price * tx.quantity)}</p>
                        </div>
                    </div>
                `;
            }).join('');

            return `
                <div class="space-y-6 fade-in max-w-6xl mx-auto pb-10">
                    <h2 class="text-2xl font-bold text-slate-800">Tổng quan kinh doanh</h2>
                    
                    <!-- Khối Hiện tại (Tồn kho & Dự kiến) -->
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h3 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-4 flex items-center"><i data-lucide="package-search" class="w-4 h-4 mr-2"></i> Tình trạng kho hiện tại</h3>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                            <div class="p-4 bg-slate-50 rounded-xl border border-slate-100">
                                <p class="text-xs text-slate-500 font-bold uppercase mb-1">Mẫu / Tổng Tồn</p>
                                <p class="text-xl font-bold text-slate-800">${totalProducts} <span class="text-sm text-slate-400 font-medium">mẫu</span> / ${totalStock} <span class="text-sm text-slate-400 font-medium">cái</span></p>
                            </div>
                            <div class="p-4 bg-rose-50/50 rounded-xl border border-rose-100">
                                <p class="text-xs text-rose-600 font-bold uppercase mb-1">Vốn bỏ ra (Nằm kho)</p>
                                <p class="text-xl font-bold text-rose-700">${formatCurrency(capitalInStock)}</p>
                            </div>
                            <div class="p-4 bg-indigo-50/50 rounded-xl border border-indigo-100">

                                    <i data-lucide="upload-cloud"></i> <span>ĐẨY DỮ LIỆU LÊN</span>
                                </button>
                                <button onclick="syncFromCloud()" class="py-4 bg-white/10 text-white border border-white/20 rounded-2xl font-bold hover:bg-white/20 transition-all flex items-center justify-center space-x-2">
                                    <i data-lucide="download-cloud"></i> <span>TẢI DỮ LIỆU VỀ</span>
                                </button>
                            </div>
                        </div>
                        <p id="sync-status" class="mt-6 text-sm font-bold text-center text-emerald-300 hidden"></p>
                    </div>
                    <div class="flex flex-col items-center pt-8 border-t border-slate-200">
                        <p class="text-sm text-slate-400 mb-4 italic font-medium">Hoặc bạn có thể sao lưu thủ công ra file JSON</p>
                        <button onclick="exportBackupData()" class="text-slate-600 hover:text-indigo-600 flex items-center space-x-2 font-bold bg-white px-4 py-2 rounded-lg border border-slate-200 shadow-sm">
                            <i data-lucide="save" class="w-4 h-4"></i> <span>Tải file Backup về máy</span>
                        </button>
                    </div>
                </div>
            `;
        }

        // --- 5. LOGIC ĐỒNG BỘ ---
        function saveSyncUrl() {
            localStorage.setItem('gearShop_syncUrl', document.getElementById('sync-url').value.trim());
            alertMessage('Đã lưu link kết nối thành công!', 'white');
        }

        async function syncToCloud() {
            const url = localStorage.getItem('gearShop_syncUrl');
            if(!url) return alertMessage('Vui lòng lưu link API trước!', 'white');
            const statusEl = document.getElementById('sync-status');
            statusEl.textContent = 'Đang đồng bộ lên Google Drive...'; statusEl.className = 'mt-6 text-sm font-bold text-center text-indigo-200 block animate-pulse';
            try {
                // Đẩy cả products, transactions và templates
                const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ products, transactions, templates }) });
                const result = await response.json();
                if(result.status === 'success') alertMessage('Đồng bộ thành công rực rỡ! ✓', 'emerald-400');
            } catch (e) { alertMessage('Lỗi kết nối. Hãy kiểm tra mạng hoặc link API.', 'rose-300'); }
        }

        async function syncFromCloud() {
            const url = localStorage.getItem('gearShop_syncUrl');
            if(!url) return alertMessage('Vui lòng lưu link API trước!', 'white');
            if(!confirm('Dữ liệu từ Cloud sẽ GHI ĐÈ dữ liệu trên máy này. Chắc chắn muốn tiếp tục?')) return;
            const statusEl = document.getElementById('sync-status');
            statusEl.textContent = 'Đang tải dữ liệu về...'; statusEl.className = 'mt-6 text-sm font-bold text-center text-indigo-200 block animate-pulse';
            try {
                const response = await fetch(url);
                const data = await response.json();
                if(data.products) { 
                    products = data.products; 
                    transactions = data.transactions; 
                    templates = data.templates || []; // Load templates (fallback [] if old backup)
                    saveDataLocally(); render(); alertMessage('Đã nạp dữ liệu mới thành công!', 'emerald-400'); 
                }
            } catch (e) { alertMessage('Lỗi tải dữ liệu. Có thể trên Cloud chưa có file.', 'rose-300'); }
        }

        function exportBackupData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ products, transactions, templates }));
            const link = document.createElement('a');
            const date = new Date().toLocaleDateString('vi-VN').replace(/\//g,'-');
            link.setAttribute("href", dataStr); link.setAttribute("download", `GearBackup_${date}.json`); link.click();
        }

        // --- 6. LOGIC SẢN PHẨM & MẪU ---
        function toggleCategoryFields() {
            const cat = document.getElementById('p-category').value;
            document.getElementById('keyboard-fields').className = (cat === 'Bàn phím') ? 'grid grid-cols-2 gap-4' : 'hidden';
        }

        function populateTemplateDropdown() {
            const select = document.getElementById('p-template-select');
            let html = '<option value="">-- Tự nhập tay hoặc chọn mẫu có sẵn --</option>';
            
            const groupedTemplates = {};
            templates.forEach(t => {
                const cat = t.category || 'Khác';
                if (!groupedTemplates[cat]) groupedTemplates[cat] = [];
                groupedTemplates[cat].push(t);
            });

            for (const [cat, items] of Object.entries(groupedTemplates)) {
                html += `<optgroup label="--- ${cat.toUpperCase()} ---">`;
                items.forEach(t => {
                    let name = `${t.brand} ${t.model} - ${t.color}`;
                    html += `<option value="${t.id}">${name}</option>`;
                });
                html += `</optgroup>`;
            }
            select.innerHTML = html;
        }

        function applyTemplate(templateId) {
            if(!templateId) return;
            const t = templates.find(x => x.id === templateId);
            if(!t) return;
            
            document.getElementById('p-category').value = t.category || 'Bàn phím';
            document.getElementById('p-brand').value = t.brand || '';
            document.getElementById('p-model').value = t.model || '';
            document.getElementById('p-color').value = t.color || '';
            document.getElementById('p-switch').value = t.switchType || '';
            document.getElementById('p-plate').value = t.plate || 'PC';
            document.getElementById('p-import').value = t.importPrice || 0;
            document.getElementById('p-export').value = t.exportPrice || 0;
            
            if(t.image) {
                document.getElementById('p-image-preview').innerHTML = `<img src="${t.image}" class="w-full h-full object-cover" />`;
                document.getElementById('p-image-base64').value = t.image;
            }
            toggleCategoryFields();
        }

        // isEditingTemplate = true -> Đang ở tab Kho mẫu, bấm sửa cái mẫu đó.
        // loadFromTemplateId = ID của mẫu -> Bấm "Dùng Mẫu" từ tab Kho Mẫu để tạo SP mới.
        function openProductModal(id = null, isEditingTemplate = false, isCreatingTemplateOnly = false) {
            document.getElementById('product-modal').classList.remove('hidden');
            const form = document.getElementById('product-form'); form.reset();
            document.getElementById('p-image-upload').value = '';
            document.getElementById('is-template-mode').value = (isEditingTemplate === true) || isCreatingTemplateOnly ? 'true' : 'false';
            
            const titleEl = document.getElementById('product-modal-title');
            const stockBox = document.getElementById('p-stock-container');
            const saveTemplateBox = document.getElementById('save-template-box');
            const templateSelectorBox = document.getElementById('template-selector-box');
            
            populateTemplateDropdown();

            if(isCreatingTemplateOnly) {
                titleEl.innerText = 'Tạo mẫu sản phẩm mới';
                document.getElementById('p-id').value = '';
                stockBox.classList.add('hidden'); // Không cần nhập số lượng cho mẫu
                saveTemplateBox.classList.add('hidden');
                templateSelectorBox.classList.add('hidden');
                document.getElementById('p-image-preview').innerHTML = `<i data-lucide="image" class="text-slate-400"></i>`;
                document.getElementById('p-image-base64').value = '';
            }
            else if(isEditingTemplate === true) { // Sửa mẫu
                const t = templates.find(x => x.id === id);
                if(!t) return;
                titleEl.innerText = 'Sửa thông tin mẫu';
                document.getElementById('p-id').value = t.id;
                document.getElementById('p-category').value = t.category || 'Bàn phím';
                document.getElementById('p-brand').value = t.brand;
                document.getElementById('p-model').value = t.model;
                document.getElementById('p-color').value = t.color;
                document.getElementById('p-switch').value = t.switchType || '';
                document.getElementById('p-plate').value = t.plate || 'PC';
                document.getElementById('p-import').value = t.importPrice;
                document.getElementById('p-export').value = t.exportPrice;
                
                stockBox.classList.add('hidden');
                saveTemplateBox.classList.add('hidden');
                templateSelectorBox.classList.add('hidden');
                
                if(t.image) document.getElementById('p-image-preview').innerHTML = `<img src="${t.image}" class="w-full h-full object-cover" />`;
                else document.getElementById('p-image-preview').innerHTML = `<i data-lucide="image" class="text-slate-400"></i>`;
                document.getElementById('p-image-base64').value = t.image || '';
            } 
            else if(typeof id === 'string' && id && !isEditingTemplate) { // Sửa Sản phẩm thực tế
                const p = products.find(x => x.id === id);
                if(!p) return;
                titleEl.innerText = 'Cập nhật cấu hình sản phẩm';
                document.getElementById('p-id').value = p.id;
                document.getElementById('p-category').value = p.category || 'Bàn phím';
                document.getElementById('p-brand').value = p.brand;
                document.getElementById('p-model').value = p.model;
                document.getElementById('p-color').value = p.color;
                document.getElementById('p-switch').value = p.switchType || '';
                document.getElementById('p-plate').value = p.plate || 'PC';
                document.getElementById('p-import').value = p.importPrice;
                document.getElementById('p-export').value = p.exportPrice;
                
                stockBox.classList.add('hidden'); // Sửa thì ko sửa tồn ở đây
                saveTemplateBox.classList.add('hidden');
                templateSelectorBox.classList.add('hidden');
                
                if(p.image) document.getElementById('p-image-preview').innerHTML = `<img src="${p.image}" class="w-full h-full object-cover" />`;
                else document.getElementById('p-image-preview').innerHTML = `<i data-lucide="image" class="text-slate-400"></i>`;
                document.getElementById('p-image-base64').value = p.image || '';
            } 
            else { // Thêm Sản phẩm mới (có thể có loadFromTemplateId)
                let loadFromTemplateId = (typeof isEditingTemplate === 'string') ? isEditingTemplate : null;
                titleEl.innerText = 'Thêm sản phẩm nhập kho mới';
                document.getElementById('p-id').value = '';
                document.getElementById('p-stock').value = 1;
                
                stockBox.classList.remove('hidden');
                saveTemplateBox.classList.remove('hidden');
                templateSelectorBox.classList.remove('hidden');
                
                if(loadFromTemplateId) {
                    document.getElementById('p-template-select').value = loadFromTemplateId;
                    applyTemplate(loadFromTemplateId);
                } else {
                    document.getElementById('p-category').value = 'Bàn phím';
                    document.getElementById('p-image-preview').innerHTML = `<i data-lucide="image" class="text-slate-400"></i>`;
                    document.getElementById('p-image-base64').value = '';
                }
            }
            toggleCategoryFields(); initIcons();
        }

        function handleSaveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('p-id').value;
            const isTemplateMode = document.getElementById('is-template-mode').value === 'true';
            const cat = document.getElementById('p-category').value;
            
            const formData = {
                category: cat, brand: document.getElementById('p-brand').value,
                model: document.getElementById('p-model').value, color: document.getElementById('p-color').value,
                switchType: cat === 'Bàn phím' ? document.getElementById('p-switch').value : '',
                plate: cat === 'Bàn phím' ? document.getElementById('p-plate').value : '',
                importPrice: parseInt(document.getElementById('p-import').value),
                exportPrice: parseInt(document.getElementById('p-export').value),
                image: document.getElementById('p-image-base64').value
            };

            if(isTemplateMode) {
                // Lưu / Cập nhật vào KHO MẪU
                if(id) {
                    const idx = templates.findIndex(t => t.id === id);
                    templates[idx] = { id: id, ...formData };
                } else {
                    templates.unshift({ id: 'tmpl_'+Date.now(), ...formData });
                }
            } else {
                // Lưu / Cập nhật vào KHO HÀNG THỰC TẾ
                const saveAsTemplate = document.getElementById('p-save-as-template') && document.getElementById('p-save-as-template').checked;
                
                if(saveAsTemplate) {
                    templates.unshift({ id: 'tmpl_'+Date.now(), ...formData });
                }

                if(id) {
                    const idx = products.findIndex(p => p.id === id);
                    formData.stock = products[idx].stock; 
                    products[idx] = { id: id, ...formData };
                } else {
                    formData.stock = parseInt(document.getElementById('p-stock').value) || 0;
                    const newId = 'p'+Date.now();
                    products.unshift({ id: newId, ...formData });
                    if(formData.stock > 0) {
                        transactions.unshift({ id: 't'+Date.now(), type: 'IMPORT', productId: newId, quantity: formData.stock, price: formData.importPrice, profit: 0, timestamp: new Date().toISOString() });
                    }
                }
            }
            
            saveDataLocally(); closeModal('product-modal'); render();
        }

        function deleteProduct(id) {
            if(confirm('Xóa sản phẩm này sẽ xóa khỏi kho thực tế. Lịch sử vẫn còn. Tiếp tục?')) { products = products.filter(p => p.id !== id); saveDataLocally(); render(); }
        }
        function deleteTemplate(id) {
            if(confirm('Xóa mẫu này? Sẽ không ảnh hưởng tới hàng đã nhập.')) { templates = templates.filter(t => t.id !== id); saveDataLocally(); render(); }
        }

        // --- 7. LOGIC GIAO DỊCH ---
        function openTxModal(type, productId) {
            const p = products.find(x => x.id === productId);
            if(!p) return;
            document.getElementById('transaction-modal').classList.remove('hidden');
            document.getElementById('tx-error-box').classList.add('hidden');
            document.getElementById('tx-type').value = type;
            document.getElementById('tx-product-id').value = productId;
            document.getElementById('tx-product-name').value = getFullProductName(p) + `\n(Tồn hiện tại: ${p.stock})`;
            document.getElementById('tx-quantity').value = 1;
            const isImport = type === 'IMPORT';
            document.getElementById('tx-header').className = `flex justify-between items-center p-5 border-b border-slate-100 ${isImport ? 'bg-indigo-50/50' : 'bg-emerald-50/50'}`;
            document.getElementById('tx-modal-title').innerText = isImport ? 'Săn thêm hàng (Nhập)' : 'Chốt đơn (Bán)';
            document.getElementById('tx-modal-title').className = `text-lg font-bold ${isImport ? 'text-indigo-800' : 'text-emerald-800'}`;
            document.getElementById('tx-price-label').innerText = isImport ? 'Giá săn lần này' : 'Giá chốt thực tế';
            document.getElementById('tx-price').value = isImport ? p.importPrice : p.exportPrice;
            document.getElementById('tx-submit-btn').className = `px-6 py-2.5 text-white rounded-xl font-bold shadow-md transition-transform transform hover:-translate-y-0.5 ${isImport ? 'bg-indigo-600 hover:bg-indigo-700 shadow-indigo-200' : 'bg-emerald-600 hover:bg-emerald-700 shadow-emerald-200'}`;
            if(!isImport) {
                document.getElementById('tx-stock-hint').innerText = `Còn ${p.stock} sản phẩm để bán`;
                document.getElementById('tx-stock-hint').classList.remove('hidden');
            } else document.getElementById('tx-stock-hint').classList.add('hidden');
            initIcons();
        }

        function handleSaveTransaction(e) {
            e.preventDefault();
            const type = document.getElementById('tx-type').value;
            const pId = document.getElementById('tx-product-id').value;
            const qty = parseInt(document.getElementById('tx-quantity').value);
            const price = parseInt(document.getElementById('tx-price').value);
            const errBox = document.getElementById('tx-error-box');
            
            const pIdx = products.findIndex(p => p.id === pId);
            const product = products[pIdx];

            if(type === 'EXPORT' && qty > product.stock) {
                errBox.innerText = 'Lỗi: Tồn kho hiện tại không đủ để bán! Hãy nhập thêm hàng.';
                errBox.classList.remove('hidden');
                return;
            }

            if(type === 'IMPORT') product.stock += qty;
            else product.stock -= qty;

            const profit = type === 'EXPORT' ? (price - product.importPrice) * qty : 0;
            transactions.unshift({ id: 't'+Date.now(), type, productId: pId, quantity: qty, price, profit, timestamp: new Date().toISOString() });
            
            saveDataLocally(); closeModal('transaction-modal'); render();
        }

        // --- 8. UTILS ---
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function alertMessage(msg, color) {
            const status = document.getElementById('sync-status');
            if(status) {
                status.innerText = msg; status.className = `mt-6 text-sm font-bold text-center text-${color} block`;
                setTimeout(() => status.classList.add('hidden'), 5000);
            }
        }
        render();
    </script>
</body>
</html>
