<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GearManager Pro - Hệ thống quản lý cửa hàng</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(100%)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- FIX LỖI UMD -->
    <script>window.react = window.React;</script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@0.284.0/dist/umd/lucide-react.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;
        
        const lucideIcons = window.lucideReact || window.LucideReact || {};
        const { 
            LayoutDashboard, Database, PackagePlus, History, Plus, Trash2, 
            CheckCircle2, Clock, CreditCard, Wallet, Truck, Store, 
            DollarSign, TrendingUp, Box, Search, Upload, Image: ImageIcon,
            CloudLightning, UploadCloud, DownloadCloud, Save, RefreshCw,
            X, AlertCircle, Info, Edit
        } = lucideIcons;

        const loadSafeData = (key, fallback) => {
            try {
                const data = localStorage.getItem(key);
                return data ? JSON.parse(data) : fallback;
            } catch (error) {
                console.error(`Lỗi dữ liệu JSON ở biến ${key}:`, error);
                return fallback;
            }
        };

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [dashboardFilter, setDashboardFilter] = useState('month'); 
            
            const [searchTerms, setSearchTerms] = useState({ templates: '', inventory: '' });

            const [templates, setTemplates] = useState(() => loadSafeData('gs_templates_pro', []));
            const [inventory, setInventory] = useState(() => loadSafeData('gs_inventory_pro', []));
            const [sales, setSales] = useState(() => loadSafeData('gs_sales_pro', []));
            
            const [syncUrl, setSyncUrl] = useState(() => localStorage.getItem('gearShop_syncUrl_pro') || '');
            const [syncStatus, setSyncStatus] = useState({ message: '', type: '' });

            const [toasts, setToasts] = useState([]);
            const showToast = (message, type = 'success') => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
            };

            // MODALS & FORMS
            const [sellModal, setSellModal] = useState({ isOpen: false, item: null, qty: 1, type: 'Ship COD', price: 0 });
            const [templateForm, setTemplateForm] = useState({ category: 'Bàn phím', brand: '', model: '', switchType: '', color: '', connectionType: '3 mode', profile: 'OEM', name: '', importPrice: 0, exportPrice: 0, image: '' });
            const [inventoryForm, setInventoryForm] = useState({ templateId: '', quantity: '', costPrice: '', sellingPrice: '', status: 'Đã về kho', payment: 'Thanh toán online' });

            // Trạng thái cho Dropdown Tìm kiếm Mẫu
            const [isTemplateDropdownOpen, setIsTemplateDropdownOpen] = useState(false);
            const [templateSearchText, setTemplateSearchText] = useState('');

            // Trạng thái cho Modal Chỉnh sửa Lô hàng
            const [editInvModal, setEditInvModal] = useState({
                isOpen: false,
                item: null,
                template: null,
                form: { quantity: 0, costPrice: 0, sellingPrice: 0, status: '', payment: '', image: '', model: '', name: '' }
            });

            useEffect(() => {
                localStorage.setItem('gs_templates_pro', JSON.stringify(templates));
                localStorage.setItem('gs_inventory_pro', JSON.stringify(inventory));
                localStorage.setItem('gs_sales_pro', JSON.stringify(sales));
            }, [templates, inventory, sales]);

            const formatCurrency = (amount) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount || 0);
            const formatDate = (dateString) => {
                const d = new Date(dateString);
                return `${d.toLocaleDateString('vi-VN')} ${d.getHours()}:${d.getMinutes().toString().padStart(2, '0')}`;
            };

            // DASHBOARD STATS
            const dashboardStats = useMemo(() => {
                const now = new Date();
                let filteredSales = sales.filter(sale => {
                    if (!sale.saleDate) return false;
                    const saleDate = new Date(sale.saleDate);
                    if (dashboardFilter === 'day') return saleDate.toDateString() === now.toDateString();
                    if (dashboardFilter === 'week') {
                        const firstDay = new Date(now.setDate(now.getDate() - now.getDay()));
                        return saleDate >= firstDay;
                    }
                    if (dashboardFilter === 'month') return saleDate.getMonth() === now.getMonth() && saleDate.getFullYear() === now.getFullYear();
                    if (dashboardFilter === 'year') return saleDate.getFullYear() === now.getFullYear();
                    return true;
                });

                let revenue = 0; let profit = 0; let itemsSold = 0;
                filteredSales.forEach(s => {
                    revenue += (Number(s.actualSellingPrice) || 0) * (Number(s.quantitySold) || 0);
                    profit += ((Number(s.actualSellingPrice) || 0) - (Number(s.costPrice) || 0)) * (Number(s.quantitySold) || 0);
                    itemsSold += Number(s.quantitySold) || 0;
                });

                return { revenue, profit, itemsSold, filteredSales };
            }, [sales, dashboardFilter]);

            const inventoryStats = useMemo(() => {
                let totalStock = 0; let totalCapital = 0;
                inventory.forEach(inv => {
                    if (Number(inv.quantity) > 0) {
                        totalStock += Number(inv.quantity);
                        totalCapital += Number(inv.quantity) * (Number(inv.costPrice) || 0);
                    }
                });
                return { totalStock, totalCapital };
            }, [inventory]);

            // SEARCH FILTERS
            const getTemplateDisplayName = (t) => {
                if (!t) return 'Sản phẩm đã xóa';
                if (t.category === 'Keycap') return `[Keycap] ${t.brand} ${t.name}`;
                return `[${t.category}] ${t.brand} ${t.model}`;
            };

            const filteredTemplates = useMemo(() => {
                if (!searchTerms.templates) return templates;
                const lowerTerm = searchTerms.templates.toLowerCase();
                return templates.filter(t => 
                    String(t.model || '').toLowerCase().includes(lowerTerm) || 
                    String(t.brand || '').toLowerCase().includes(lowerTerm) ||
                    String(t.name || '').toLowerCase().includes(lowerTerm)
                );
            }, [templates, searchTerms.templates]);

            const filteredInventory = useMemo(() => {
                if (!searchTerms.inventory) return inventory;
                const lowerTerm = searchTerms.inventory.toLowerCase();
                return inventory.filter(inv => {
                    const t = templates.find(temp => temp.id === inv.templateId);
                    if (!t) return false;
                    return String(t.model || '').toLowerCase().includes(lowerTerm) || 
                           String(t.brand || '').toLowerCase().includes(lowerTerm) ||
                           String(t.name || '').toLowerCase().includes(lowerTerm);
                });
            }, [inventory, templates, searchTerms.inventory]);

            const dropdownFilteredTemplates = useMemo(() => {
                return templates.filter(t => getTemplateDisplayName(t).toLowerCase().includes(templateSearchText.toLowerCase()));
            }, [templates, templateSearchText]);


            // IMAGE HANDLERS
            const processImage = (file, callback) => {
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 400; 
                        let scaleSize = MAX_WIDTH / img.width;
                        if (scaleSize > 1) scaleSize = 1; 
                        
                        canvas.width = img.width * scaleSize;
                        canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        callback(canvas.toDataURL('image/jpeg', 0.7));
                    }
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            const handleImageChange = (e) => {
                processImage(e.target.files[0], (base64) => {
                    setTemplateForm(prev => ({ ...prev, image: base64 }));
                });
                e.target.value = ''; 
            };

            const handleEditModalImageChange = (e) => {
                processImage(e.target.files[0], (base64) => {
                    setEditInvModal(prev => ({ ...prev, form: { ...prev.form, image: base64 } }));
                });
                e.target.value = ''; 
            };

            // ACTIONS
            const handleAddTemplate = (e) => {
                e.preventDefault();
                const newTemplate = { 
                    ...templateForm, 
                    id: 'tmpl_' + Date.now().toString(),
                    importPrice: Number(templateForm.importPrice),
                    exportPrice: Number(templateForm.exportPrice),
                    createdAt: new Date().toISOString() 
                };
                setTemplates(prev => [newTemplate, ...prev]);
                setTemplateForm({ category: 'Bàn phím', brand: '', model: '', switchType: '', color: '', connectionType: '3 mode', profile: 'OEM', name: '', importPrice: 0, exportPrice: 0, image: '' });
                showToast('Đã thêm mẫu sản phẩm mới!', 'success');
            };

            const handleAddInventory = (e) => {
                e.preventDefault();
                if (!inventoryForm.templateId) return showToast('Vui lòng chọn mẫu sản phẩm từ danh sách!', 'error');

                const newInv = {
                    ...inventoryForm,
                    id: 'inv_' + Date.now().toString(),
                    quantity: Number(inventoryForm.quantity),
                    costPrice: Number(inventoryForm.costPrice),
                    sellingPrice: Number(inventoryForm.sellingPrice),
                    dateAdded: new Date().toISOString()
                };
                setInventory(prev => [newInv, ...prev]);
                setInventoryForm({ templateId: '', quantity: '', costPrice: '', sellingPrice: '', status: 'Đã về kho', payment: 'Thanh toán online' });
                setTemplateSearchText('');
                showToast('Đã thêm hàng vào kho!', 'success');
            };

            const handleEditInventorySubmit = (e) => {
                e.preventDefault();
                const { form, item, template } = editInvModal;
                
                // Cập nhật lô hàng (Inventory)
                setInventory(prev => prev.map(i => i.id === item.id ? {
                    ...i,
                    quantity: Number(form.quantity),
                    costPrice: Number(form.costPrice),
                    sellingPrice: Number(form.sellingPrice),
                    status: form.status,
                    payment: form.payment
                } : i));

                // Cập nhật Template Gốc (Tên & Hình ảnh sẽ đồng bộ cho mọi lô hàng dùng chung mẫu)
                if (template) {
                    setTemplates(prev => prev.map(t => t.id === template.id ? {
                        ...t,
                        image: form.image,
                        model: template.category === 'Keycap' ? t.model : form.model,
                        name: template.category === 'Keycap' ? form.name : t.name
                    } : t));
                }

                showToast('Đã cập nhật thông tin lô hàng!', 'success');
                setEditInvModal({ isOpen: false, item: null, template: null, form: {} });
            };

            const openEditInvModal = (inv) => {
                const t = getTemplate(inv.templateId);
                setEditInvModal({
                    isOpen: true,
                    item: inv,
                    template: t,
                    form: {
                        quantity: inv.quantity,
                        costPrice: inv.costPrice,
                        sellingPrice: inv.sellingPrice,
                        status: inv.status || 'Đã về kho',
                        payment: inv.payment || 'Thanh toán online',
                        image: t?.image || '',
                        model: t?.model || '',
                        name: t?.name || ''
                    }
                });
            };

            const handleSell = (e) => {
                e.preventDefault();
                const { item, qty, type, price } = sellModal;
                if(qty > item.quantity) return showToast('Số lượng bán vượt quá tồn kho!', 'error');

                const saleData = {
                    id: 'tx_' + Date.now().toString(),
                    inventoryId: item.id,
                    templateId: item.templateId,
                    quantitySold: Number(qty),
                    actualSellingPrice: Number(price),
                    costPrice: item.costPrice || 0,
                    deliveryType: type,
                    saleDate: new Date().toISOString()
                };

                setInventory(prev => prev.map(inv => inv.id === item.id ? { ...inv, quantity: inv.quantity - qty } : inv));
                setSales(prev => [saleData, ...prev]);
                setSellModal({ isOpen: false, item: null, qty: 1, type: 'Ship COD', price: 0 });
                showToast(`Đã chốt đơn thành công ${qty} sản phẩm!`, 'success');
            };

            const handleDeleteTemplate = (id) => {
                const isUsed = inventory.some(inv => inv.templateId === id);
                if (isUsed) {
                    showToast('Không thể xóa mẫu đang có hàng trong kho!', 'error');
                    return;
                }
                setTemplates(prev => prev.filter(t => t.id !== id));
                showToast('Đã xóa mẫu sản phẩm', 'info');
            };

            const handleDeleteInventory = (id) => {
                setInventory(prev => prev.filter(i => i.id !== id));
                showToast('Đã xóa lô hàng khỏi kho', 'info');
            };

            const handleDeleteSale = (saleId) => {
                const sale = sales.find(s => s.id === saleId);
                if (!sale) return;

                const isRestore = window.confirm('Bạn có muốn HOÀN LẠI số lượng của đơn này vào kho không?\n(Nhấn OK để Hoàn vào kho, Cancel để Chỉ xóa lịch sử)');
                
                if (isRestore) {
                    setInventory(prev => {
                        const invExists = prev.find(i => i.id === sale.inventoryId);
                        if (invExists) {
                            return prev.map(i => i.id === sale.inventoryId ? { ...i, quantity: Number(i.quantity) + Number(sale.quantitySold) } : i);
                        } else {
                            const restoredInv = {
                                id: sale.inventoryId,
                                templateId: sale.templateId,
                                quantity: Number(sale.quantitySold),
                                costPrice: sale.costPrice,
                                sellingPrice: sale.actualSellingPrice,
                                status: 'Đã về kho',
                                payment: 'Hoàn trả',
                                dateAdded: new Date().toISOString()
                            };
                            return [restoredInv, ...prev];
                        }
                    });
                    showToast('Đã hoàn số lượng vào kho và xóa đơn!', 'success');
                } else {
                    showToast('Đã xóa lịch sử đơn hàng', 'info');
                }
                
                setSales(prev => prev.filter(s => s.id !== saleId));
            };

            // SYNC CLOUD
            const handleSaveSyncUrl = () => {
                localStorage.setItem('gearShop_syncUrl_pro', syncUrl.trim());
                showToast('Đã lưu link kết nối!', 'success');
            };

            const syncToCloud = async () => {
                if(!syncUrl) return showToast('Vui lòng lưu link API trước!', 'error');
                setSyncStatus({ message: 'Đang đồng bộ...', type: 'text-indigo-400 animate-pulse' });
                try {
                    const response = await fetch(syncUrl, { 
                        method: 'POST', 
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
                        body: JSON.stringify({ templates, inventory, transactions: sales }) 
                    });
                    const result = await response.json();
                    if(result.status === 'success') {
                        setSyncStatus({ message: 'Đồng bộ thành công rực rỡ! ✓', type: 'text-emerald-400' });
                        showToast('Đồng bộ lên Cloud thành công!', 'success');
                    }
                } catch (e) { 
                    setSyncStatus({ message: 'Lỗi kết nối API', type: 'text-rose-400' });
                    showToast('Lỗi đẩy dữ liệu', 'error');
                }
            };

            const syncFromCloud = async () => {
                if(!syncUrl) return showToast('Vui lòng lưu link API trước!', 'error');
                if(!window.confirm('CẢNH BÁO: Dữ liệu từ Cloud sẽ GHI ĐÈ toàn bộ dữ liệu trên máy này. Tiếp tục?')) return;
                
                setSyncStatus({ message: 'Đang tải về...', type: 'text-indigo-400 animate-pulse' });
                try {
                    const response = await fetch(syncUrl);
                    const data = await response.json();
                    if(data.templates) setTemplates(data.templates);
                    if(data.inventory) setInventory(data.inventory);
                    if(data.transactions) setSales(data.transactions);
                    
                    setSyncStatus({ message: 'Đã nạp dữ liệu thành công!', type: 'text-emerald-400' });
                    showToast('Tải dữ liệu thành công!', 'success');
                } catch (e) { 
                    setSyncStatus({ message: 'Lỗi tải dữ liệu', type: 'text-rose-400' });
                    showToast('Không thể tải dữ liệu', 'error');
                }
            };

            const exportBackupData = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ templates, inventory, transactions: sales }));
                const link = document.createElement('a');
                const date = new Date().toLocaleDateString('vi-VN').replace(/\//g,'-');
                link.setAttribute("href", dataStr); link.setAttribute("download", `GearPro_Backup_${date}.json`); link.click();
            };

            // HELPERS
            const getTemplate = (tId) => templates.find(x => x.id === tId);
            const getTemplateDetails = (t) => {
                if (!t) return '';
                if (t.category === 'Bàn phím') return `${t.switchType} • ${t.color}`;
                if (t.category === 'Chuột') return `${t.connectionType} • ${t.color}`;
                if (t.category === 'Keycap') return `Profile ${t.profile}`;
                return `${t.switchType || t.connectionType || ''} ${t.color || ''}`;
            };

            if (!LayoutDashboard) return <div className="flex h-screen items-center justify-center p-4 text-center">Đang tải tài nguyên hoặc mạng gặp sự cố. Vui lòng tải lại trang (F5)...</div>;

            return (
                <div className="flex h-screen bg-slate-50 font-sans text-slate-800 overflow-hidden selection:bg-blue-200">
                    
                    {/* TOAST CONTAINER */}
                    <div className="fixed top-4 right-4 z-[100] flex flex-col space-y-2 pointer-events-none">
                        {toasts.map(toast => (
                            <div key={toast.id} className={`flex items-center p-4 rounded-xl shadow-lg border animate-slide-up pointer-events-auto min-w-[280px]
                                ${toast.type === 'success' ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 
                                  toast.type === 'error' ? 'bg-rose-50 border-rose-200 text-rose-800' : 
                                  'bg-blue-50 border-blue-200 text-blue-800'}`}>
                                {toast.type === 'success' && <CheckCircle2 className="w-5 h-5 mr-3 text-emerald-500" />}
                                {toast.type === 'error' && <AlertCircle className="w-5 h-5 mr-3 text-rose-500" />}
                                {toast.type === 'info' && <Info className="w-5 h-5 mr-3 text-blue-500" />}
                                <p className="font-medium text-sm">{toast.message}</p>
                            </div>
                        ))}
                    </div>

                    {/* SIDEBAR DESKTOP */}
                    <div className="w-64 bg-slate-900 text-slate-300 flex flex-col shadow-xl z-20 hidden md:flex shrink-0">
                        <div className="p-6 bg-slate-950/50">
                            <h1 className="text-2xl font-black text-white flex items-center tracking-tight">
                                <LayoutDashboard className="mr-3 text-blue-500" /> GearPro<span className="text-blue-500">.</span>
                            </h1>
                            <p className="text-xs text-slate-500 mt-2 font-medium uppercase tracking-wider">Workspace</p>
                        </div>
                        <nav className="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
                            {[{id:'dashboard', icon: TrendingUp, label: 'Tổng quan'}, 
                              {id:'templates', icon: Database, label: 'Mẫu sản phẩm'}, 
                              {id:'inventory', icon: PackagePlus, label: 'Kho hàng'}, 
                              {id:'sales', icon: History, label: 'Lịch sử đơn'},
                              {id:'sync', icon: RefreshCw, label: 'Đồng bộ Cloud'}
                            ].map(tab => (
                                <button key={tab.id} onClick={() => setActiveTab(tab.id)} 
                                    className={`w-full flex items-center px-4 py-3.5 rounded-xl transition-all duration-200 font-medium ${activeTab === tab.id ? 'bg-blue-600 text-white shadow-lg shadow-blue-900/40 translate-x-1' : 'hover:bg-slate-800 hover:text-white hover:translate-x-1'}`}>
                                    <tab.icon size={20} className="mr-3" /> {tab.label}
                                </button>
                            ))}
                        </nav>
                        <div className="p-4 text-xs text-center text-slate-600 border-t border-slate-800">
                            GearManager Pro v2.2
                        </div>
                    </div>

                    {/* MAIN CONTENT */}
                    <div className="flex-1 flex flex-col overflow-hidden relative">
                        
                        {/* HEADER MOBILE */}
                        <div className="md:hidden bg-white p-4 border-b flex justify-between items-center shrink-0 z-20 shadow-sm">
                            <h1 className="text-xl font-black text-slate-900 flex items-center">
                                <LayoutDashboard className="w-6 h-6 mr-2 text-blue-600" /> GearPro
                            </h1>
                            <div className="flex space-x-1">
                                {[{id:'dashboard', icon: TrendingUp}, {id:'templates', icon: Database}, {id:'inventory', icon: PackagePlus}, {id:'sync', icon: RefreshCw}].map(t => (
                                    <button key={t.id} onClick={() => setActiveTab(t.id)} className={`p-2.5 rounded-xl transition-colors ${activeTab===t.id?'bg-blue-100 text-blue-600':'text-slate-500 hover:bg-slate-100'}`}>
                                        <t.icon size={20}/>
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* CONTENT AREA */}
                        <div className="flex-1 overflow-auto bg-slate-50/50">
                            <div className="p-4 md:p-8 max-w-[1400px] mx-auto space-y-8">
                                
                                {/* ---------------- TAB 1: DASHBOARD ---------------- */}
                                {activeTab === 'dashboard' && (
                                <div className="space-y-6 animate-fade-in">
                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
                                        <div>
                                            <h2 className="text-3xl font-bold text-slate-900 tracking-tight">Tổng quan kinh doanh</h2>
                                            <p className="text-slate-500 mt-1">Báo cáo hiệu suất bán hàng của bạn</p>
                                        </div>
                                        <div className="bg-white p-1 rounded-xl shadow-sm border border-slate-200 flex space-x-1 overflow-x-auto max-w-full">
                                            {['day', 'week', 'month', 'year'].map(filter => (
                                                <button key={filter} onClick={() => setDashboardFilter(filter)} 
                                                    className={`px-4 py-2 rounded-lg text-sm font-semibold transition-all whitespace-nowrap ${dashboardFilter === filter ? 'bg-slate-900 text-white shadow-md' : 'text-slate-500 hover:bg-slate-100'}`}>
                                                    {filter === 'day' ? 'Hôm nay' : filter === 'week' ? 'Tuần này' : filter === 'month' ? 'Tháng này' : 'Năm nay'}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex items-center hover:shadow-md transition-shadow">
                                            <div className="p-4 bg-emerald-100 text-emerald-600 rounded-2xl mr-5"><DollarSign size={28} /></div>
                                            <div><p className="text-sm font-medium text-slate-500 mb-1">Doanh thu</p><h3 className="text-2xl font-black text-slate-800">{formatCurrency(dashboardStats.revenue)}</h3></div>
                                        </div>
                                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex items-center hover:shadow-md transition-shadow">

                                            <div><p className="text-sm font-medium text-slate-500 mb-1">Lợi nhuận ròng</p><h3 className="text-2xl font-black text-violet-600">{formatCurrency(dashboardStats.profit)}</h3></div>
                                        </div>
                                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex items-center hover:shadow-md transition-shadow">
                                            <div className="p-4 bg-blue-100 text-blue-600 rounded-2xl mr-5"><Box size={28} /></div>
                                            <div><p className="text-sm font-medium text-slate-500 mb-1">Sản phẩm đã bán</p><h3 className="text-2xl font-black text-slate-800">{dashboardStats.itemsSold} <span className="text-base font-medium text-slate-400">cái</span></h3></div>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mt-4">
                                        <div className="bg-gradient-to-br from-slate-900 to-slate-800 p-6 rounded-3xl shadow-lg border border-slate-800 flex items-center">
                                            <div className="p-4 bg-white/10 text-white rounded-2xl mr-5 backdrop-blur-sm"><Database size={28} /></div>
                                            <div><p className="text-sm font-medium text-slate-300 mb-1">Vốn lưu động trong kho</p><h3 className="text-2xl font-black text-white">{formatCurrency(inventoryStats.totalCapital)}</h3></div>
                                        </div>
                                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex items-center hover:shadow-md transition-shadow">
                                            <div className="p-4 bg-orange-100 text-orange-600 rounded-2xl mr-5"><PackagePlus size={28} /></div>
                                            <div><p className="text-sm font-medium text-slate-500 mb-1">Tồn kho hiện tại</p><h3 className="text-2xl font-black text-slate-800">{inventoryStats.totalStock} <span className="text-base font-medium text-slate-400">sản phẩm</span></h3></div>
                                        </div>
                                    </div>

                                    <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden mt-8">
                                        <div className="p-6 border-b border-slate-100 flex justify-between items-center">
                                            <h3 className="text-lg font-bold">Giao dịch gần đây</h3>
                                            <button onClick={() => setActiveTab('sales')} className="text-sm text-blue-600 font-medium hover:underline">Xem tất cả</button>
                                        </div>
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left border-collapse min-w-[600px]">
                                                <thead><tr className="bg-slate-50 text-slate-500 text-sm border-b border-slate-100">
                                                    <th className="p-4 font-semibold">Thời gian</th>
                                                    <th className="p-4 font-semibold">Sản phẩm</th>
                                                    <th className="p-4 font-semibold text-center">Giao hàng</th>
                                                    <th className="p-4 font-semibold text-right">Lợi nhuận</th>
                                                </tr></thead>
                                                <tbody className="divide-y divide-slate-100">
                                                    {dashboardStats.filteredSales.length === 0 ? 
                                                        <tr><td colSpan="4" className="p-12 text-center text-slate-400 flex flex-col items-center"><Box className="w-12 h-12 mb-3 text-slate-200"/> Chưa có dữ liệu giao dịch</td></tr> 
                                                    : dashboardStats.filteredSales.slice(0, 5).map(sale => {
                                                        const t = getTemplate(sale.templateId);
                                                        return (
                                                        <tr key={sale.id} className="hover:bg-slate-50 transition-colors">
                                                            <td className="p-4 text-sm text-slate-600 font-medium">{formatDate(sale.saleDate).split(' ')[0]}</td>
                                                            <td className="p-4 flex items-center space-x-3">
                                                                {t?.image ? <img src={t.image} alt="thumb" className="w-10 h-10 object-cover rounded-xl shadow-sm shrink-0" /> : <div className="w-10 h-10 bg-slate-100 rounded-xl flex items-center justify-center text-slate-400 shrink-0"><ImageIcon size={18}/></div>}
                                                                <p className="font-semibold text-slate-800">{getTemplateDisplayName(t)} <span className="text-slate-400 font-normal">x{sale.quantitySold}</span></p>
                                                            </td>
                                                            <td className="p-4 text-center">
                                                                <span className={`inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold whitespace-nowrap ${String(sale.deliveryType) === 'Ship COD' ? 'bg-orange-100 text-orange-700' : 'bg-blue-100 text-blue-700'}`}>
                                                                    {String(sale.deliveryType) === 'Ship COD' ? <Truck size={12} className="mr-1"/> : <Store size={12} className="mr-1"/>} {sale.deliveryType}
                                                                </span>
                                                            </td>
                                                            <td className="p-4 text-right font-black text-violet-600">{formatCurrency((Number(sale.actualSellingPrice) - Number(sale.costPrice || 0)) * Number(sale.quantitySold))}</td>
                                                        </tr>
                                                    )})}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                                )}

                                {/* ---------------- TAB 2: MẪU SẢN PHẨM ---------------- */}
                                {activeTab === 'templates' && (
                                <div className="space-y-6 animate-fade-in">
