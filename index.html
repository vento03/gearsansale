<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GearManager Pro - Hệ thống quản lý cửa hàng</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'slide-up': 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- FIX LỖI UMD -->
    <script>window.react = window.React;</script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@0.284.0/dist/umd/lucide-react.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;
        
        const lucideIcons = window.lucideReact || window.LucideReact || {};
        const { 
            LayoutDashboard, Database, PackagePlus, History, Plus, Trash2, 
            CheckCircle2, Clock, CreditCard, Wallet, Truck, Store, 
            DollarSign, TrendingUp, Box, Search, Upload, Image: ImageIcon,
            CloudLightning, UploadCloud, DownloadCloud, Save, RefreshCw,
            X, AlertCircle, Info, Edit, ChevronDown, ShoppingCart
        } = lucideIcons;

        // BẢO VỆ DỮ LIỆU: Đảm bảo dữ liệu từ localStorage luôn đúng định dạng
        const loadSafeData = (key, fallback) => {
            try {
                const data = localStorage.getItem(key);
                if (!data) return fallback;
                const parsed = JSON.parse(data);
                
                // Ép kiểu: Nếu fallback là mảng mà data parse ra không phải mảng -> trả về mảng rỗng
                if (Array.isArray(fallback) && !Array.isArray(parsed)) {
                    console.warn(`Khôi phục dữ liệu mảng an toàn cho ${key}`);
                    return fallback;
                }
                return parsed;
            } catch (error) {
                console.error(`Lỗi dữ liệu JSON ở biến ${key}:`, error);
                return fallback;
            }
        };

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [dashboardFilter, setDashboardFilter] = useState('month'); 
            
            const [searchTerms, setSearchTerms] = useState({ templates: '', inventory: '' });

            // THÊM 2 STATE MỚI CHO BỘ LỌC KHO HÀNG
            const [inventoryCategoryFilter, setInventoryCategoryFilter] = useState('All');
            const [inventoryStockFilter, setInventoryStockFilter] = useState('in_stock'); // Mặc định chỉ hiện hàng còn tồn

            const [templates, setTemplates] = useState(() => loadSafeData('gs_templates_pro', []));
            const [inventory, setInventory] = useState(() => loadSafeData('gs_inventory_pro', []));
            const [sales, setSales] = useState(() => loadSafeData('gs_sales_pro', []));
            
            const [syncUrl, setSyncUrl] = useState(() => localStorage.getItem('gearShop_syncUrl_pro') || '');
            const [syncStatus, setSyncStatus] = useState({ message: '', type: '' });

            const [toasts, setToasts] = useState([]);
            const showToast = (message, type = 'success') => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
            };

            // MODALS & FORMS
            const [sellModal, setSellModal] = useState({ isOpen: false, item: null, qty: 1, type: 'Ship COD', price: 0 });
            const [templateForm, setTemplateForm] = useState({ category: 'Bàn phím', brand: '', model: '', switchType: '', color: '', connectionType: '3 mode', profile: 'OEM', name: '', importPrice: 0, exportPrice: 0, image: '' });
            const [inventoryForm, setInventoryForm] = useState({ templateId: '', quantity: '', costPrice: '', sellingPrice: '', status: 'Đã về kho', payment: 'Thanh toán online' });

            // Dropdown Custom
            const [isTemplateDropdownOpen, setIsTemplateDropdownOpen] = useState(false);
            const [templateSearchText, setTemplateSearchText] = useState('');

            // Edit Modal
            const [editInvModal, setEditInvModal] = useState({
                isOpen: false, item: null, template: null,
                form: { quantity: 0, costPrice: 0, sellingPrice: 0, status: '', payment: '', image: '', model: '', name: '' }
            });

            // Save to LocalStorage
            useEffect(() => {
                localStorage.setItem('gs_templates_pro', JSON.stringify(templates));
                localStorage.setItem('gs_inventory_pro', JSON.stringify(inventory));
                localStorage.setItem('gs_sales_pro', JSON.stringify(sales));
            }, [templates, inventory, sales]);

            // Utils
            const formatCurrency = (amount) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount || 0);
            const formatDate = (dateString) => {
                const d = new Date(dateString);
                return `${d.toLocaleDateString('vi-VN')} ${d.getHours()}:${d.getMinutes().toString().padStart(2, '0')}`;
            };

            // DASHBOARD STATS
            const dashboardStats = useMemo(() => {
                const now = new Date();
                let filteredSales = (Array.isArray(sales) ? sales : []).filter(sale => {
                    if (!sale || !sale.saleDate) return false;
                    const saleDate = new Date(sale.saleDate);
                    if (dashboardFilter === 'day') return saleDate.toDateString() === now.toDateString();
                    if (dashboardFilter === 'week') {
                        const firstDay = new Date(now.setDate(now.getDate() - now.getDay()));
                        return saleDate >= firstDay;
                    }
                    if (dashboardFilter === 'month') return saleDate.getMonth() === now.getMonth() && saleDate.getFullYear() === now.getFullYear();
                    if (dashboardFilter === 'year') return saleDate.getFullYear() === now.getFullYear();
                    return true;
                });

                let revenue = 0; let profit = 0; let itemsSold = 0;
                filteredSales.forEach(s => {
                    revenue += (Number(s.actualSellingPrice) || 0) * (Number(s.quantitySold) || 0);
                    profit += ((Number(s.actualSellingPrice) || 0) - (Number(s.costPrice) || 0)) * (Number(s.quantitySold) || 0);
                    itemsSold += Number(s.quantitySold) || 0;
                });

                return { revenue, profit, itemsSold, filteredSales };
            }, [sales, dashboardFilter]);

            const inventoryStats = useMemo(() => {
                let totalStock = 0; let totalCapital = 0;
                if(Array.isArray(inventory)) {
                    inventory.forEach(inv => {
                        if (inv && Number(inv.quantity) > 0) {
                            totalStock += Number(inv.quantity);
                            totalCapital += Number(inv.quantity) * (Number(inv.costPrice) || 0);
                        }
                    });
                }
                return { totalStock, totalCapital };
            }, [inventory]);

            // SEARCH FILTERS
            const getTemplateDisplayName = (t) => {
                if (!t) return 'Sản phẩm đã xóa';
                if (t.category === 'Keycap') return `[Keycap] ${t.brand || ''} ${t.name || ''}`.trim();
                return `[${t.category || 'Khác'}] ${t.brand || ''} ${t.model || ''}`.trim();
            };

            const filteredTemplates = useMemo(() => {
                const validTemplates = Array.isArray(templates) ? templates : [];
                if (!searchTerms.templates) return validTemplates;
                const lowerTerm = searchTerms.templates.toLowerCase();
                return validTemplates.filter(t => 
                    t && (
                        String(t.model || '').toLowerCase().includes(lowerTerm) || 
                        String(t.brand || '').toLowerCase().includes(lowerTerm) ||
                        String(t.name || '').toLowerCase().includes(lowerTerm)
                    )
                );
            }, [templates, searchTerms.templates]);

            const filteredInventory = useMemo(() => {
                const validInventory = Array.isArray(inventory) ? inventory : [];
                const validTemplates = Array.isArray(templates) ? templates : [];
                
                return validInventory.filter(inv => {
                    if (!inv) return false;
                    const t = validTemplates.find(temp => temp && temp.id === inv.templateId);
                    if (!t) return false;

                    // 1. Lọc theo trạng thái Còn hàng / Hết hàng
                    if (inventoryStockFilter === 'in_stock' && Number(inv.quantity) <= 0) return false;
                    if (inventoryStockFilter === 'out_of_stock' && Number(inv.quantity) > 0) return false;

                    // 2. Lọc theo danh mục sản phẩm
                    if (inventoryCategoryFilter !== 'All' && t.category !== inventoryCategoryFilter) return false;

                    // 3. Lọc theo từ khóa tìm kiếm
                    if (searchTerms.inventory) {
                        const lowerTerm = searchTerms.inventory.toLowerCase();
                        const isMatch = String(t.model || '').toLowerCase().includes(lowerTerm) || 
                                        String(t.brand || '').toLowerCase().includes(lowerTerm) ||
                                        String(t.name || '').toLowerCase().includes(lowerTerm);
                        if (!isMatch) return false;
                    }

                    return true;
                });
            }, [inventory, templates, searchTerms.inventory, inventoryStockFilter, inventoryCategoryFilter]);

            const dropdownFilteredTemplates = useMemo(() => {
                const validTemplates = Array.isArray(templates) ? templates : [];
                return validTemplates.filter(t => t && getTemplateDisplayName(t).toLowerCase().includes(templateSearchText.toLowerCase()));
            }, [templates, templateSearchText]);

            // IMAGE HANDLERS
            const processImage = (file, callback) => {
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 400; 
                        let scaleSize = MAX_WIDTH / img.width;
                        if (scaleSize > 1) scaleSize = 1; 
                        
                        canvas.width = img.width * scaleSize;
                        canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        callback(canvas.toDataURL('image/jpeg', 0.7));
                    }
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            const handleImageChange = (e) => {
                processImage(e.target.files[0], (base64) => {
                    setTemplateForm(prev => ({ ...prev, image: base64 }));
                });
                e.target.value = ''; 
            };

            const handleEditModalImageChange = (e) => {
                processImage(e.target.files[0], (base64) => {
                    setEditInvModal(prev => ({ ...prev, form: { ...prev.form, image: base64 } }));
                });
                e.target.value = ''; 
            };

            // ACTIONS
            const handleAddTemplate = (e) => {
                e.preventDefault();
                if(!templateForm.brand) return showToast('Vui lòng nhập thương hiệu', 'error');
                
                const newTemplate = { 
                    ...templateForm, 
                    id: 'tmpl_' + Date.now().toString() + Math.random().toString(36).substr(2, 5),
                    importPrice: Number(templateForm.importPrice) || 0,
                    exportPrice: Number(templateForm.exportPrice) || 0,
                    createdAt: new Date().toISOString() 
                };
                setTemplates(prev => [newTemplate, ...(Array.isArray(prev) ? prev : [])]);
                setTemplateForm({ category: 'Bàn phím', brand: '', model: '', switchType: '', color: '', connectionType: '3 mode', profile: 'OEM', name: '', importPrice: 0, exportPrice: 0, image: '' });
                showToast('Đã thêm mẫu sản phẩm mới!', 'success');
            };

            const handleAddInventory = (e) => {
                e.preventDefault();
                if (!inventoryForm.templateId) return showToast('Vui lòng chọn mẫu sản phẩm từ danh sách!', 'error');

                const newInv = {
                    ...inventoryForm,
                    id: 'inv_' + Date.now().toString() + Math.random().toString(36).substr(2, 5),
                    quantity: Number(inventoryForm.quantity) || 0,
                    costPrice: Number(inventoryForm.costPrice) || 0,
                    sellingPrice: Number(inventoryForm.sellingPrice) || 0,
                    dateAdded: new Date().toISOString()
                };
                setInventory(prev => [newInv, ...(Array.isArray(prev) ? prev : [])]);
                setInventoryForm({ templateId: '', quantity: '', costPrice: '', sellingPrice: '', status: 'Đã về kho', payment: 'Thanh toán online' });
                setTemplateSearchText('');
                showToast('Đã thêm hàng vào kho!', 'success');
            };

            const handleEditInventorySubmit = (e) => {
                e.preventDefault();
                const { form, item, template } = editInvModal;
                
                setInventory(prev => (Array.isArray(prev) ? prev : []).map(i => i.id === item.id ? {
                    ...i,
                    quantity: Number(form.quantity),
                    costPrice: Number(form.costPrice),
                    sellingPrice: Number(form.sellingPrice),
                    status: form.status,
                    payment: form.payment
                } : i));

                if (template) {
                    setTemplates(prev => (Array.isArray(prev) ? prev : []).map(t => t.id === template.id ? {
                        ...t,
                        image: form.image,
                        model: template.category === 'Keycap' ? t.model : form.model,
                        name: template.category === 'Keycap' ? form.name : t.name
                    } : t));
                }

                showToast('Đã cập nhật thông tin lô hàng!', 'success');
                setEditInvModal({ isOpen: false, item: null, template: null, form: {} });
            };

            const openEditInvModal = (inv) => {
                const t = getTemplate(inv.templateId);
                setEditInvModal({
                    isOpen: true, item: inv, template: t,
                    form: {
                        quantity: inv.quantity || 0, costPrice: inv.costPrice || 0, sellingPrice: inv.sellingPrice || 0,
                        status: inv.status || 'Đã về kho', payment: inv.payment || 'Thanh toán online',
                        image: t?.image || '', model: t?.model || '', name: t?.name || ''
                    }
                });
            };

            const openSellModal = (inv) => {
                setSellModal({
                    isOpen: true, item: inv, qty: 1, type: 'Ship COD', price: inv.sellingPrice || 0
                });
            };

            const handleSell = (e) => {
                e.preventDefault();
                const { item, qty, type, price } = sellModal;
                if(qty > item.quantity) return showToast('Số lượng bán vượt quá tồn kho!', 'error');
                if(qty <= 0) return showToast('Số lượng bán phải lớn hơn 0', 'error');

                const saleData = {
                    id: 'tx_' + Date.now().toString() + Math.random().toString(36).substr(2, 5),
                    inventoryId: item.id, templateId: item.templateId,
                    quantitySold: Number(qty), actualSellingPrice: Number(price),
                    costPrice: item.costPrice || 0, deliveryType: type,
                    saleDate: new Date().toISOString()
                };

                setInventory(prev => (Array.isArray(prev) ? prev : []).map(inv => inv.id === item.id ? { ...inv, quantity: inv.quantity - qty } : inv));
                setSales(prev => [saleData, ...(Array.isArray(prev) ? prev : [])]);
                setSellModal({ isOpen: false, item: null, qty: 1, type: 'Ship COD', price: 0 });
                showToast(`Đã chốt đơn thành công ${qty} sản phẩm!`, 'success');
            };

            const handleDeleteTemplate = (id) => {
                const isUsed = (Array.isArray(inventory) ? inventory : []).some(inv => inv.templateId === id);
                if (isUsed) {
                    showToast('Không thể xóa mẫu đang có hàng trong kho!', 'error');
                    return;
                }
                if(window.confirm('Bạn có chắc chắn muốn xóa mẫu sản phẩm này?')) {
                    setTemplates(prev => (Array.isArray(prev) ? prev : []).filter(t => t.id !== id));
                    showToast('Đã xóa mẫu sản phẩm', 'info');
                }
            };

            const handleDeleteInventory = (id) => {
                if(window.confirm('Bạn có chắc chắn muốn xóa lô hàng này khỏi kho?')) {
                    setInventory(prev => (Array.isArray(prev) ? prev : []).filter(i => i.id !== id));
                    showToast('Đã xóa lô hàng khỏi kho', 'info');
                }
            };

            const handleDeleteSale = (saleId) => {
                const sale = (Array.isArray(sales) ? sales : []).find(s => s.id === saleId);
                if (!sale) return;

                const isRestore = window.confirm('Bạn có muốn HOÀN LẠI số lượng của đơn này vào kho không?\n(Nhấn OK để Hoàn vào kho, Cancel để Chỉ xóa lịch sử)');
                
                if (isRestore) {
                    setInventory(prev => {
                        const safePrev = Array.isArray(prev) ? prev : [];
                        const invExists = safePrev.find(i => i.id === sale.inventoryId);
                        if (invExists) {
                            return safePrev.map(i => i.id === sale.inventoryId ? { ...i, quantity: Number(i.quantity) + Number(sale.quantitySold) } : i);
                        } else {
                            const restoredInv = {
                                id: sale.inventoryId, templateId: sale.templateId,
                                quantity: Number(sale.quantitySold), costPrice: sale.costPrice,
                                sellingPrice: sale.actualSellingPrice, status: 'Đã về kho',
                                payment: 'Hoàn trả', dateAdded: new Date().toISOString()
                            };
                            return [restoredInv, ...safePrev];
                        }
                    });
                    showToast('Đã hoàn số lượng vào kho và xóa đơn!', 'success');
                } else {
                    showToast('Đã xóa lịch sử đơn hàng', 'info');
                }
                setSales(prev => (Array.isArray(prev) ? prev : []).filter(s => s.id !== saleId));
            };

            const handleSaveSyncUrl = () => {
                localStorage.setItem('gearShop_syncUrl_pro', syncUrl.trim());
                showToast('Đã lưu link kết nối API!', 'success');
            };

            // FIX: Thay thế các phần rút gọn (...) bằng logic thực tế.
            const syncToCloud = async () => {
                if(!syncUrl) return showToast('Vui lòng lưu link API Web App trước!', 'error');
                setSyncStatus({ message: 'Đang đồng bộ lên Google Drive...', type: 'text-indigo-400 animate-pulse' });
                
                try {
                    const response = await fetch(syncUrl, { 
                        method: 'POST', 
                        headers: { 
                            'Content-Type': 'text/plain;charset=utf-8' 
                        }, 
                        body: JSON.stringify({ templates, inventory, transactions: sales }),
                        redirect: "follow" 
                    });
                    
                    const result = await response.json();
                    if(result.status === 'success' || result.success) {
                        setSyncStatus({ message: 'Đồng bộ thành công rực rỡ! ✓', type: 'text-emerald-400' });
                        showToast('Đồng bộ lên Cloud thành công!', 'success');
                    } else {
                        throw new Error("API trả về lỗi");
                    }
                } catch (e) { 
                    console.error("Lỗi đồng bộ:", e);
                    setSyncStatus({ message: 'Lỗi kết nối API. Hãy kiểm tra lại link Google Apps Script.', type: 'text-rose-400' });
                    showToast('Lỗi đẩy dữ liệu (CORS/Network)', 'error');
                }
            };

            const syncFromCloud = async () => {
                if(!syncUrl) return showToast('Vui lòng lưu link API Web App trước!', 'error');
                if(!window.confirm('CẢNH BÁO: Dữ liệu từ Cloud sẽ GHI ĐÈ toàn bộ dữ liệu trên máy này. Tiếp tục?')) return;
                
                setSyncStatus({ message: 'Đang tải về từ Google Drive...', type: 'text-indigo-400 animate-pulse' });
                try {
                    const response = await fetch(syncUrl, {
                        method: 'GET',
                        redirect: "follow" 
                    });
                    const data = await response.json();
                    
                    if(data.templates) setTemplates(data.templates);
                    if(data.inventory) setInventory(data.inventory);
                    if(data.transactions) setSales(data.transactions);
                    
                    setSyncStatus({ message: 'Đã nạp dữ liệu thành công!', type: 'text-emerald-400' });
                    showToast('Tải dữ liệu thành công!', 'success');
                } catch (e) { 
                    console.error("Lỗi tải dữ liệu:", e);
                    setSyncStatus({ message: 'Lỗi tải dữ liệu. Kiểm tra quyền truy cập Google Drive.', type: 'text-rose-400' });
                    showToast('Không thể tải dữ liệu', 'error');
                }
            };

            const exportBackupData = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ templates, inventory, transactions: sales }));
                const link = document.createElement('a');
                const date = new Date().toLocaleDateString('vi-VN').replace(/\//g,'-');
                link.setAttribute("href", dataStr); link.setAttribute("download", `GearPro_Backup_${date}.json`); link.click();
            };

            // HELPERS
            const getTemplate = (tId) => (Array.isArray(templates) ? templates : []).find(x => x && x.id === tId);
            const getTemplateDetails = (t) => {
                if (!t) return '';
                if (t.category === 'Bàn phím') return `${t.switchType || ''} • ${t.color || ''}`;
                if (t.category === 'Chuột') return `${t.connectionType || ''} • ${t.color || ''}`;
                if (t.category === 'Keycap') return `Profile ${t.profile || ''}`;
                return `${t.switchType || t.connectionType || ''} ${t.color || ''}`;
            };

            if (!LayoutDashboard) return <div className="flex h-screen items-center justify-center p-4 text-center font-medium">Đang tải tài nguyên hoặc mạng gặp sự cố. Vui lòng tải lại trang (F5)...</div>;

            return (
                <div className="flex h-screen bg-slate-50 font-sans text-slate-800 overflow-hidden selection:bg-blue-200">
                    
                    {/* TOAST CONTAINER */}
                    <div className="fixed top-4 right-4 z-[100] flex flex-col space-y-2 pointer-events-none">
                        {toasts.map(toast => (
                            <div key={toast.id} className={`flex items-center p-4 rounded-xl shadow-lg border animate-slide-up pointer-events-auto min-w-[280px]
                                ${toast.type === 'success' ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 
                                  toast.type === 'error' ? 'bg-rose-50 border-rose-200 text-rose-800' : 
                                  'bg-blue-50 border-blue-200 text-blue-800'}`}>
                                {toast.type === 'success' && CheckCircle2 && <CheckCircle2 className="w-5 h-5 mr-3 text-emerald-500" />}
                                {toast.type === 'error' && AlertCircle && <AlertCircle className="w-5 h-5 mr-3 text-rose-500" />}
                                {toast.type === 'info' && Info && <Info className="w-5 h-5 mr-3 text-blue-500" />}
                                <p className="font-medium text-sm">{toast.message}</p>
                            </div>
                        ))}
                    </div>

                    {/* SIDEBAR DESKTOP */}
                    <div className="w-64 bg-slate-900 text-slate-300 flex flex-col shadow-xl z-20 hidden md:flex shrink-0">
                        <div className="p-6 bg-slate-950/50">
                            <h1 className="text-2xl font-black text-white flex items-center tracking-tight">
                                {LayoutDashboard && <LayoutDashboard className="mr-3 text-blue-500" />} GearPro<span className="text-blue-500">.</span>
                            </h1>
                            <p className="text-xs text-slate-500 mt-2 font-medium uppercase tracking-wider">Workspace</p>
                        </div>
                        <nav className="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
                            {[{id:'dashboard', icon: TrendingUp, label: 'Tổng quan'}, 
                              {id:'templates', icon: Database, label: 'Mẫu sản phẩm'}, 
                              {id:'inventory', icon: PackagePlus, label: 'Kho hàng'}, 
                              {id:'sales', icon: History, label: 'Lịch sử đơn'},

                        {/* HEADER MOBILE */}

                            <div className="flex space-x-1">
                                {[{id:'dashboard', icon: TrendingUp}, {id:'templates', icon: Database}, {id:'inventory', icon: PackagePlus}, {id:'sync', icon: RefreshCw}].map(t => (
                                    <button key={t.id} onClick={() => setActiveTab(t.id)} className={`p-2.5 rounded-xl transition-colors ${activeTab===t.id?'bg-blue-100 text-blue-600':'text-slate-500 hover:bg-slate-100'}`}>

                                ))}
                            </div>
